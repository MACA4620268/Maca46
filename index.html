<style>
:root{--az:#123a63;--az2:#1d5a96;--fondo:#eef2f6;--card:#fff;--txt:#1b2733;--sub:#5b6b7b;--ok:#1e8e3e;--falta:#e8710a;--mal:#c5221f;--borde:#d5dde6;--hb:56px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--txt);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea{font:inherit}
.bar{position:sticky;top:0;z-index:20;height:var(--hb);background:var(--az);color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;box-shadow:0 2px 6px #0003}
.bar h1{font-size:16px;margin:0;flex:1;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font-weight:400;font-size:12px;opacity:.85}
.bar .ib{background:none;border:0;color:#fff;font-size:24px;width:44px;height:44px;border-radius:8px}
.bar .ib:active{background:#fff2}
main{padding:12px 12px 90px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.obra{cursor:pointer;border-left:6px solid var(--az2)}
.obra:active{background:#f6f9fc}
.obra h2{margin:0 0 6px;font-size:20px;color:var(--az)}
.obra .sub{color:var(--sub);font-size:13px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.kv b{font-variant-numeric:tabular-nums}
.barra{height:12px;background:#e3e8ee;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;background:var(--az2)}
.est{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tag{font-weight:700;padding:2px 8px;border-radius:10px;font-size:13px}
.tag.ok{background:#e6f4ea;color:var(--ok)} .tag.mal{background:#fce8e6;color:var(--mal)} .tag.falta{background:#fef0e1;color:var(--falta)} .tag.neu{background:#e8eef4;color:var(--sub)}
.plazo{font-size:14px;color:var(--sub);margin:0 2px 10px}
.total{background:var(--az);color:#fff}
.total .kv{font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.btn{border:0;border-radius:10px;padding:13px 10px;font-weight:700;background:var(--az2);color:#fff;min-height:48px}
.btn:active{filter:brightness(.9)}
.btn.sec{background:#fff;color:var(--az);border:2px solid var(--az2)}
.btn.ok{background:var(--ok)} .btn.mal{background:var(--mal)} .btn.wa{background:#1f9d55}
.btn[disabled]{opacity:.45}
.full{grid-column:1/-1}
.aviso{background:#fff4e5;border:1px solid #f6c26b;color:#7a4a00;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.chips{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:var(--hb);z-index:5;background:var(--fondo);padding:8px 0}
.chip{flex:1;border:2px solid var(--az2);background:#fff;color:var(--az);border-radius:20px;padding:7px 4px;font-weight:700;font-size:14px}
.chip.on{background:var(--az2);color:#fff}
.cap{font-weight:700;color:var(--az);font-size:14px;padding:10px 4px 6px;border-bottom:2px solid var(--az2);margin-top:6px;display:flex;justify-content:space-between}
.cap span{font-weight:400;color:var(--sub)}
.pt{display:flex;align-items:center;gap:10px;background:#fff;padding:11px 10px;border-bottom:1px solid var(--borde);cursor:pointer}
.pt:active{background:#eef4fb}
.pt .it{font-weight:700;font-size:14px;min-width:42px;color:var(--az)}
.pt .ds{flex:1;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pt .ds small{color:var(--sub)}
.pt .pc{font-weight:700;font-size:14px;min-width:58px;text-align:right}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.c-ok{color:var(--ok)} .c-falta{color:var(--falta)} .c-mal{color:var(--mal)}
.bg-ok{background:var(--ok)} .bg-falta{background:var(--falta)}
.nom{font-size:17px;font-weight:700;color:var(--az)}
.nom .it{display:inline-block;background:var(--az);color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:14px}
label.l{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px;font-weight:600}
.fecha{display:flex;gap:8px;align-items:center}
.fecha input{flex:1;min-width:0;width:100%;padding:12px;border:2px solid var(--borde);border-radius:10px;font-size:18px;font-weight:700;color:var(--az);background:#fff;min-height:50px}
.fecha .hoy{border:0;background:#e8eef4;color:var(--az);border-radius:10px;padding:0 14px;font-weight:700;min-height:50px}
.met{display:flex;align-items:center;gap:8px}
.met input{flex:1;min-width:0;width:100%;padding:12px;border:2px solid var(--az2);border-radius:10px;font-size:24px;font-weight:700;text-align:right;min-height:56px}
.met input.err{border-color:var(--mal);background:#fff5f5}
.met .u{font-weight:700;color:var(--sub);min-width:40px}
.obs{width:100%;padding:10px 12px;border:2px solid var(--borde);border-radius:10px;font-size:15px}
.err-msg{background:#fce8e6;color:var(--mal);font-weight:700;border-radius:8px;padding:9px 11px;margin-top:8px;font-size:14px}
.info{border:1px solid var(--borde);border-radius:10px;margin-top:14px;padding:4px 12px;background:#f9fbfd}
.info .kv{border-bottom:1px dashed var(--borde);padding:7px 0}
.info .kv:last-child{border:0}
.prev{font-size:13px;color:var(--sub);margin-top:6px;text-align:right}
.acc{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.hist th{background:#e8eef4;color:var(--az);text-align:right;padding:7px 6px;font-size:12px}
.hist th:first-child,.hist td:first-child,.hist th:last-child,.hist td:last-child{text-align:left}
.hist td{padding:9px 6px;border-bottom:1px solid var(--borde);text-align:right;font-variant-numeric:tabular-nums}
.hist tr.r{cursor:pointer} .hist tr.r:active{background:#eef4fb}
.hist tfoot td{font-weight:700;border-top:2px solid var(--az2)}
.vacio{color:var(--sub);text-align:center;padding:14px;font-size:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.res-wrap{background:#fff;border-radius:10px;box-shadow:0 1px 3px #0002}
table.res{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12px}
@media (max-width:480px){table.res{font-size:11px}table.res td{padding:6px 2px!important}table.res th{padding:7px 1px!important;font-size:10px!important}}
table.res th{position:sticky;top:var(--hb);z-index:4;background:var(--az2);color:#fff;padding:8px 4px;font-size:11px;line-height:1.15;text-align:center;border-right:1px solid #ffffff40}
table.res td{padding:7px 4px;overflow-wrap:anywhere;border-bottom:1px solid var(--borde);vertical-align:top;font-variant-numeric:tabular-nums}
table.res td.n{text-align:right;white-space:nowrap}
table.res td.c{text-align:center}
table.res tr.capr td{background:#e8eef4;font-weight:700;color:var(--az)}
table.res tr.hl td{background:#fff3c4;font-weight:700}
table.res tr.done td.s{color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2733;color:#fff;padding:12px 18px;border-radius:24px;font-weight:600;z-index:60;box-shadow:0 4px 14px #0005;max-width:92vw;text-align:center}
.modal-bg{position:fixed;inset:0;background:#0007;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px 22px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px;color:var(--az)}
.pre{white-space:pre-wrap;background:#f4f7fa;border:1px solid var(--borde);border-radius:10px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;max-height:45vh;overflow:auto}
.lock{position:fixed;inset:0;z-index:100;background:var(--az);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:8px}
.lk-ic{font-size:34px}.lk-t{font-size:20px;font-weight:700}.lk-s{opacity:.85;font-size:15px}
.dots{display:flex;gap:16px;margin:10px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}.dots i.on{background:#fff}
.lk-m{min-height:22px;color:#ffd7d4;font-weight:700;text-align:center}
.kp{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.kp button{height:74px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:28px;font-weight:600}.kp button:active{background:#ffffff55}
.lk-l{background:none;border:0;color:#cfe3ff;text-decoration:underline;margin-top:6px;font-size:15px}
.sec-t{font-weight:700;color:var(--az);font-size:16px;margin:0 0 8px}
.ok-msg{background:#e6f4ea;color:var(--ok);font-weight:700;border-radius:8px;padding:9px 11px;font-size:14px;margin-bottom:8px}
.ds2{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;font-size:14px;color:#33414f;margin-top:6px}
.txa{width:100%;min-height:220px;padding:10px 12px;border:2px solid var(--az2);border-radius:10px;font-size:15px;line-height:1.4;font-family:inherit}
.sel{width:100%;padding:11px;border:2px solid var(--borde);border-radius:10px;font-size:16px;background:#fff;min-height:48px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;align-items:center;font-size:13px}
.grid3 b{text-align:center;color:var(--sub);font-size:12px}
.grid3 input{width:100%;min-width:0;padding:9px 4px;border:2px solid var(--borde);border-radius:8px;font-size:17px;text-align:center}
.sech{margin:18px 0 6px;padding:6px 10px;background:var(--az);color:#fff;border-radius:8px;font-weight:700;font-size:14px}
.subh{font-weight:700;color:var(--az);margin:8px 0 4px;font-size:14px}
.almf{border:1px dashed var(--borde);border-radius:10px;padding:8px;margin:6px 0}
.almf .am{width:100%;padding:10px;border:2px solid var(--borde);border-radius:8px;font-size:16px}
.almf .r2{display:grid;grid-template-columns:1fr 1.2fr 1.2fr 40px;gap:6px;margin-top:6px}
.almf .r2 input{min-width:0;padding:9px 4px;border:2px solid var(--borde);border-radius:8px;font-size:15px;text-align:center}
.xb{border:0;background:#fce8e6;color:#8a1c17;border-radius:8px;font-size:18px}
.btn.mini{min-height:40px;padding:8px;font-size:15px;margin:4px 0}
.avt{width:100%;border-collapse:collapse;font-size:13px}.avt th{background:#e8eef5;color:var(--az);padding:5px;text-align:center}.avt td{border-bottom:1px solid var(--borde);padding:5px}.avt td+td{text-align:right;white-space:nowrap}

.galeria{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.thb{position:relative;border:1px solid var(--borde);border-radius:8px;overflow:hidden;background:#eee}
.thb img{width:100%;height:120px;object-fit:cover;display:block}
.thb .cap{font-size:11px;padding:3px 5px;color:var(--sub)}
.thb .xf{position:absolute;top:4px;right:4px;border:0;background:rgba(138,28,23,.85);color:#fff;border-radius:6px;width:26px;height:26px;font-size:15px}
.lista{max-height:46vh;overflow-y:auto;border:1px solid var(--borde);border-radius:10px;margin-top:4px;background:#fff}
.itm{padding:10px 12px;border-bottom:1px solid #eef1f4;cursor:pointer}
.itm:active{background:#eef4fb}
.itm .nm{font-weight:600;font-size:15px;color:#1a2b3c}
.itm .sd{font-size:12px;color:var(--sub);margin-top:2px}
.itm.ago{background:#fde8e8}
.itm.ago .nm{color:#8a1c17}
.card2{background:#f4f6f9;border-radius:10px;padding:10px;margin:8px 0}
.card.ago,.card2.ago{background:#fde8e8}
.c-mal{color:var(--mal)}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<input id="fotoInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="fotoElegida(this.files[0]);this.value=''">
<script src="jszip.min.js"></script>
<script>
"use strict";
const KEY='avobra_regs', KOBRA='avobra_obra', KPIN='avobra_pin', VERSION='3.6.2';
const DIAS=['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
// ---------- datos de la obra (se cargan desde un archivo privado, solo en este celular) ----------
let OB=null,DB={},OBRAS=[],INICIO='',FIN='',PLAZO=0,TIT='',TIT2='',P={},PRES=null;
function obraValida(x){if(!x||x.app!=='avobra-obra'||!Array.isArray(x.obras)||!x.obras.length)throw new Error('El archivo no es un archivo de obra de esta aplicación.');
  if(!/^\d{4}-\d\d-\d\d$/.test(x.inicio||'')||!/^\d{4}-\d\d-\d\d$/.test(x.fin||'')||x.fin<x.inicio)throw new Error('El archivo de obra no tiene fechas de inicio y término válidas.');
  x.obras.forEach(o=>{if(!o.k||!o.n||!Array.isArray(o.caps))throw new Error('Archivo de obra incompleto.');o.caps.forEach(c=>c.p.forEach(q=>{if(!q.i||!q.d||!q.u||!(q.m>0))throw new Error('Partida inválida en '+o.n+': '+(q.i||'?'));}));});return true;}
function cargarObra(){try{const x=JSON.parse(localStorage.getItem(KOBRA));if(x){obraValida(x);return x;}}catch(e){}return null;}
function aplicarObra(x0){OB=x0;DB={};OBRAS=[];P={};PRES=null;if(!x0)return;const x=JSON.parse(JSON.stringify(x0));INICIO=x.inicio;FIN=x.fin;PLAZO=diffD(INICIO,FIN)+1;TIT=x.titulo||'';TIT2=x.subtitulo||'';
  PRES=x.pres?{nombre:x.pres.nombre,fecha:x.pres.fecha,cargado:x.cargado}:null;
  x.obras.forEach(o=>{OBRAS.push({k:o.k,n:o.n});DB[o.k]={n:o.d||'',caps:o.caps};o.caps.forEach(c=>c.p.forEach(q=>{q.o=o.k;q.cap=c;q.mc=Math.round(q.m*100);if(!PRES){q.pu=null;q.s=0;}P[o.k+'|'+q.i]=q;}));});}
let S=cargar();
function cargar(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.regs))return s;}catch(e){}return{regs:[],lastBackup:null};}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(S));return true;}catch(e){aviso('No se pudo guardar en el celular. Revise el espacio de almacenamiento.');return false;}}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
// ---------- utilidades ----------
const pad=n=>String(n).padStart(2,'0');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fF=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
const diaSem=iso=>DIAS[new Date(iso+'T12:00:00').getDay()];
const diffD=(a,b)=>Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);
const n2=(x,d=2)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sol=x=>'S/ '+n2(x);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const und=u=>({M2:'m²',M3:'m³',ML:'ml'}[u]||u.toLowerCase());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function regsDe(o,i){return S.regs.filter(r=>r.o===o&&r.i===i).sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:a.t-b.t);}
function acumC(o,i,excl){let s=0;for(const r of S.regs)if(r.o===o&&r.i===i&&r.id!==excl)s+=r.qc;return s;}
function estP(p){const ac=acumC(p.o,p.i);return{ac,sal:p.mc-ac,pct:p.mc?ac/p.mc*100:0,done:ac>=p.mc};}
function resObra(k){let pres=0,av=0,sp=0,n=0;DB[k].caps.forEach(c=>c.p.forEach(p=>{const f=Math.min(1,acumC(k,p.i)/p.mc);sp+=f;n++;if(PRES){pres+=p.s;av+=p.s*f;}}));return PRES?{pres,av,sal:pres-av,pct:pres?av/pres*100:0}:{pct:n?sp/n*100:0};}
function plazo(){const h=hoy();let dia=diffD(INICIO,h)+1;if(dia<0)dia=0;if(dia>PLAZO)dia=PLAZO;return{dia,pct:dia/PLAZO*100,faltan:PLAZO-dia};}
function parseNum(s){s=String(s).trim().replace(',','.');if(!/^\d+(\.\d+)?$/.test(s))return{err:'Ingrese un número válido.'};const d=(s.split('.')[1]||'').length;if(d>2)return{err:'Use como máximo 2 decimales.'};const c=Math.round(parseFloat(s)*100);if(c<=0)return{err:'El metrado debe ser mayor que cero.'};return{c};}
function validarFecha(f){if(!f)return'Seleccione una fecha.';if(f<INICIO||f>FIN)return'La fecha debe estar entre '+fF(INICIO)+' y '+fF(FIN)+'.';if(f>hoy())return'No se puede registrar una fecha futura.';return'';}
function maxFecha(){const h=hoy();return h<FIN?h:FIN;}
function fechaDefecto(){const h=hoy();return h<INICIO?INICIO:h>FIN?FIN:h;}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function vibrar(){try{navigator.vibrate&&navigator.vibrate([90,60,90]);}catch(e){}}
function modal(html){return new Promise(res=>{const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML='<div class="modal">'+html+'</div>';document.body.appendChild(bg);
  const close=v=>{bg.remove();res(v);};bg.addEventListener('click',e=>{if(e.target===bg)close(null);const b=e.target.closest('[data-v]');if(b)close(b.dataset.v);});bg._close=close;});}
function aviso(m){return modal('<h3>Aviso</h3><p>'+esc(m)+'</p><button class="btn full" style="width:100%" data-v="ok">Entendido</button>');}
const $=s=>document.querySelector(s);
// ---------- navegación ----------
const app=$('#app');
window.addEventListener('hashchange',render);
function ir(h,reemplazar){if(reemplazar)location.replace(h);else location.hash=h;}
function bar(t,sub,back){return '<div class="bar">'+(back?'<button class="ib" onclick="history.length>1?history.back():ir(\'#/\')" aria-label="Volver">←</button>':'')+'<h1>'+t+(sub?'<small>'+sub+'</small>':'')+'</h1>'+(back?'<button class="ib" onclick="ir(\'#/\')" aria-label="Inicio">⌂</button>':'')+'</div>';}
function render(){if(bloqueado)return;document.querySelectorAll('.modal-bg').forEach(m=>m._close?m._close(null):m.remove());const h=location.hash.replace(/^#\/?/,'').split('/');window.scrollTo(0,0);
  if(!OB)return vBienvenida();
  if(h[0]==='obra'&&DB[h[1]])return vObra(h[1]);
  if(h[0]==='reg'&&P[h[1]+'|'+h[2]])return vReg(P[h[1]+'|'+h[2]]);
  if(h[0]==='res'&&DB[h[1]])return vRes(h[1],h[2]);
  if(h[0]==='dia')return vDia();
  if(h[0]==='respaldo')return vResp();
  if(h[0]==='cuad')return vCuad();
  if(h[0]==='as')return vAsiento(h[1],h[2],h[3]);
  if(h[0]==='parte')return vParte(h[1]);
  if(h[0]==='agentes')return vAgentes();
  if(h[0]==='config')return vConfig();
  if(h[0]==='import')return vImport();
  if(h[0]==='rep')return vRep(h[1]);
  if(h[0]==='almacen')return vAlmacen();
  if(h[0]==='almmov')return vAlmMov();
  if(h[0]==='asis')return vAsis(h[1]);
  if(h[0]==='fotos')return vFotos();
  if(h[0]==='folios')return vFolios(h[1]);
  vInicio();}
// ---------- Pantalla 1: inicio ----------
let instalarEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalarEvt=e;if(!location.hash||location.hash==='#/')render();});
function vInicio(){const pl=plazo();let tp=0,ta=0,spct=0;
  const cards=OBRAS.map(o=>{const r=resObra(o.k);if(PRES){tp+=r.pres;ta+=r.av;}spct+=r.pct;const atr=pl.dia>0&&r.pct+1e-9<pl.pct;

  const tpct=PRES?(tp?ta/tp*100:0):spct/OBRAS.length;

   (instalarEvt?'<button class="btn ok full" onclick="instalar()">📲 Instalar aplicación</button>':'')+'</div>'+

let filtro='T',filtroMin=0;
function vObra(k){const O=OBRAS.find(o=>o.k===k);
  const chip=(v,t)=>'<button class="chip'+(filtro===v?' on':'')+'" onclick="filtro=\''+v+'\';vObra(\''+k+'\')">'+t+'</button>';
  let html='';
  DB[k].caps.forEach(c=>{const rows=c.p.map(p=>{const e=estP(p);if(filtro==='F'&&e.done||filtro==='C'&&!e.done||filtro==='V'&&!(e.pct>filtroMin))return'';
      return '<div class="pt" onclick="ir(\'#/reg/'+k+'/'+p.i+'\')"><span class="dot '+(e.done?'bg-ok':'bg-falta')+'"></span><span class="it">'+p.i+'</span><span class="ds">'+esc(p.d)+' <small>('+p.u+')</small></span><span class="pc '+(e.done?'c-ok':'c-falta')+'">'+n2(e.pct,0)+' %</span></div>';}).join('');
    if(rows)html+='<div class="cap">'+c.c+' '+esc(c.t)+'</div>'+rows;});
  if(!html)html='<div class="vacio">No hay partidas en este filtro.</div>';
  app.innerHTML=bar(O.n,esc(DB[k].n),true)+'<main><div class="chips">'+chip('T','Todas')+chip('F','Faltan')+chip('C','Completadas')+chip('V','Valorizadas')+'</div>'+(filtro==='V'?'<div class="card" style="padding:10px;display:flex;align-items:center;gap:8px"><span>% mínimo</span><input inputmode="decimal" value="'+filtroMin+'" style="flex:0 0 90px;padding:8px;border:2px solid var(--borde);border-radius:8px;text-align:right" onchange="filtroMin=parseFloat(this.value)||0;vObra(\''+k+'\')"><span class="sub">o más</span></div>':'')+'<div class="card" style="padding:0;overflow:hidden">'+html+'</div></main>';}
// ---------- Pantalla 3: registro ----------
function vReg(p){const O=OBRAS.find(o=>o.k===p.o),e=estP(p),u=und(p.u);
  const regs=regsDe(p.o,p.i);let ac=0;
  const filas=regs.map(r=>{ac+=r.qc;return '<tr class="r" onclick="editarReg(\''+r.id+'\')"><td>'+fF(r.f)+'</td><td>'+n2(r.qc/100)+'</td><td>'+n2(ac/100)+'</td><td>'+(r.obs?esc(r.obs):'—')+'</td></tr>';}).join('');
  app.innerHTML=bar(O.n+' · '+p.i,'Registro de avance',true)+'<main><div class="card">'+
   '<div class="nom"><span class="it">'+p.i+'</span>'+esc(p.d)+'</div>'+
   (e.done?'<div class="err-msg" style="background:#e6f4ea;color:var(--ok)">✔ Partida COMPLETADA. Ya no admite más avance.</div>':
   '<label class="l">FECHA (toque para cambiarla)</label><div class="fecha"><input type="date" id="f" value="'+fechaDefecto()+'" min="'+INICIO+'" max="'+maxFecha()+'" onclick="try{this.showPicker()}catch(e){}"><button class="hoy" onclick="$(\'#f\').value=fechaDefecto();chk()">Hoy</button></div>'+
   '<label class="l">METRADO AVANZADO</label><div class="met"><input id="q" inputmode="decimal" autocomplete="off" placeholder="0.00" oninput="chk()"><span class="u">'+u+'</span></div><div id="prev" class="prev"></div><div id="err"></div>'+
   '<label class="l">OBSERVACIÓN (opcional)</label><input id="obs" class="obs" maxlength="80" placeholder="Ej.: muro eje A-B">')+
   '<div class="info"><div class="kv"><span>Total metrado</span><b>'+n2(p.m)+' '+u+'</b></div><div class="kv"><span>Avance hasta la fecha</span><b>'+n2(e.ac/100)+' '+u+'</b></div><div class="kv"><span>Saldo metrado</span><b>'+n2(e.sal/100)+' '+u+'</b></div><div class="kv"><span>Avance</span><b>'+n2(e.pct,2)+' %</b></div><div class="kv"><span>Estado</span><span class="tag '+(e.done?'ok':'falta')+'">'+(e.done?'COMPLETADO':'FALTA')+'</span></div></div>'+
   (e.done?'<div class="acc"><button class="btn sec full" style="grid-column:1/-1" onclick="history.back()">← Volver</button></div>':'<div class="acc"><button class="btn sec" onclick="history.back()">CANCELAR</button><button class="btn ok" id="ok" onclick="aceptar(\''+p.o+'\',\''+p.i+'\')">ACEPTAR</button></div>')+
   '</div><div class="card"><b style="color:var(--az)">Registros anteriores</b>'+(regs.length?'<table class="hist"><thead><tr><th>FECHA</th><th>METRADO</th><th>ACUMUL.</th><th>OBS.</th></tr></thead><tbody>'+filas+'</tbody><tfoot><tr><td>Total</td><td>'+n2(e.ac/100)+'</td><td></td><td>'+u+'</td></tr></tfoot></table><div class="prev" style="text-align:left">Toque un registro para corregirlo o borrarlo.</div>':'<div class="vacio">Sin registros aún.</div>')+'</div></main>';
  window._p=p;}
function chk(){const p=window._p,q=$('#q');if(!q)return null;const e=$('#err'),pv=$('#prev');e.innerHTML='';q.classList.remove('err');pv.textContent='';
  if(!q.value.trim())return null;const r=parseNum(q.value);
  if(r.err){q.classList.add('err');e.innerHTML='<div class="err-msg">'+r.err+'</div>';return null;}
  const sal=p.mc-acumC(p.o,p.i);
  if(r.c>sal){q.classList.add('err');e.innerHTML='<div class="err-msg">⛔ Excede el metrado. Saldo disponible: '+n2(sal/100)+' '+und(p.u)+'</div>';return null;}
  const nac=acumC(p.o,p.i)+r.c;pv.textContent='Quedará: acumulado '+n2(nac/100)+' · saldo '+n2((p.mc-nac)/100)+' · '+n2(nac/p.mc*100,2)+' %';return r.c;}
function rebote(msg){const e=$('#err');e.innerHTML='<div class="err-msg">'+msg+'</div>';const c=$('.card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');vibrar();}
function aceptar(o,i){const p=P[o+'|'+i],q=$('#q'),f=$('#f').value;
  const ef=validarFecha(f);if(ef)return rebote('⛔ '+ef);
  if(!q.value.trim())return rebote('⛔ Ingrese el metrado avanzado.');
  const r=parseNum(q.value);if(r.err)return rebote('⛔ '+r.err);
  const sal=p.mc-acumC(o,i);if(r.c>sal){q.classList.add('err');return rebote('⛔ Excede el metrado. Saldo disponible: '+n2(sal/100)+' '+und(p.u)+'. No se registró.');}
  const reg={id:uid(),o,i,f,qc:r.c,obs:$('#obs').value.trim(),t:Date.now()};S.regs.push(reg);
  if(!guardar()){S.regs.pop();return;}
  $('#ok').disabled=true;toast('✔ Registrado '+n2(r.c/100)+' '+und(p.u)+' en '+i+' ('+fF(f)+')');ir('#/res/'+o+'/'+i,true);}
async function editarReg(id){const r=S.regs.find(x=>x.id===id);if(!r)return;const p=P[r.o+'|'+r.i];
  const v=await modal('<h3>Registro del '+fF(r.f)+'</h3><p style="margin:0 0 6px">'+p.i+' · '+esc(p.d)+'</p><label class="l">FECHA</label><div class="fecha"><input type="date" id="ef" value="'+r.f+'" min="'+INICIO+'" max="'+maxFecha()+'"></div><label class="l">METRADO</label><div class="met"><input id="eq" inputmode="decimal" value="'+n2(r.qc/100).replace(/,/g,'')+'"><span class="u">'+und(p.u)+'</span></div><label class="l">OBSERVACIÓN</label><input id="eo" class="obs" maxlength="80" value="'+esc(r.obs)+'"><div id="eerr"></div><div class="acc" style="grid-template-columns:1fr 1fr 1fr"><button class="btn mal" data-v="del">Borrar</button><button class="btn sec" data-v="no">Cancelar</button><button class="btn ok" id="eok">Guardar</button></div>'
   .replace('id="eok"','id="eok" onclick="guardarEd(\''+id+'\')"'));
  if(v==='del'){const c=await modal('<h3>¿Borrar este registro?</h3><p>'+fF(r.f)+' · '+n2(r.qc/100)+' '+und(p.u)+'</p><div class="acc" style="grid-template-columns:1fr 1fr"><button class="btn sec" data-v="no">No</button><button class="btn mal" data-v="si">Sí, borrar</button></div>');
    if(c==='si'){const bk=S.regs.slice();S.regs=S.regs.filter(x=>x.id!==id);if(!guardar())S.regs=bk;else toast('Registro borrado');render();}}}
function guardarEd(id){const r=S.regs.find(x=>x.id===id),p=P[r.o+'|'+r.i],e=$('#eerr');
  const f=$('#ef').value,ef=validarFecha(f);if(ef){e.innerHTML='<div class="err-msg">⛔ '+ef+'</div>';vibrar();return;}
  const q=parseNum($('#eq').value);if(q.err){e.innerHTML='<div class="err-msg">⛔ '+q.err+'</div>';vibrar();return;}
  const otros=acumC(r.o,r.i,id);if(otros+q.c>p.mc){e.innerHTML='<div class="err-msg">⛔ Excede el metrado. Máximo permitido para este registro: '+n2((p.mc-otros)/100)+' '+und(p.u)+'</div>';vibrar();return;}
  const bk={...r};r.f=f;r.qc=q.c;r.obs=$('#eo').value.trim();if(!guardar()){Object.assign(r,bk);return;}
  document.querySelector('.modal-bg')._close('ok');toast('✔ Registro corregido');render();}

   '<div class="btns" style="margin-top:12px"><button class="btn sec" onclick="ir(\'#/obra/'+k+'\',true)">← Partidas</button><button class="btn" onclick="ir(\'#/\')">⌂ Inicio</button></div></main>';
  if(item){const tr=document.getElementById('r'+item.replace('.','_'));if(tr)setTimeout(()=>{const y=tr.getBoundingClientRect().top+scrollY-innerHeight/3;scrollTo(0,Math.max(0,y));},60);}}
// ---------- Exportar por día (texto WhatsApp) ----------
function textoDia(f){const L=['*AVANCE DIARIO – '+diaSem(f)+' '+fF(f)+'*',TIT2,''];let hay=false;
  OBRAS.forEach(o=>{L.push('*'+o.n+'*');const rs=S.regs.filter(r=>r.o===o.k&&r.f===f);
    if(!rs.length){L.push('(sin avance registrado)');L.push('');return;}hay=true;
    const items=[...new Set(rs.map(r=>r.i))].sort();let sd=0;
    items.forEach(i=>{const p=P[o.k+'|'+i];const qd=rs.filter(r=>r.i===i).reduce((s,r)=>s+r.qc,0);
      const ac=S.regs.filter(r=>r.o===o.k&&r.i===i&&r.f<=f).reduce((s,r)=>s+r.qc,0);const u=und(p.u);
      L.push(i+' '+p.d);L.push('  Hoy: '+n2(qd/100)+' '+u+' | Acum: '+n2(ac/100)+' | Saldo: '+n2((p.mc-ac)/100)+' ('+n2(ac/p.mc*100,2)+'%)');
      const obs=rs.filter(r=>r.i===i&&r.obs).map(r=>r.obs);if(obs.length)L.push('  Obs: '+obs.join('; '));if(PRES)sd+=p.s*qd/p.mc;});
    if(PRES)L.push('_Avance valorizado del día: '+sol(sd)+'_');L.push('');});
  L.push('Residente de Obra');return{txt:L.join('\n'),hay};}
function vDia(){const f0=fechaDefecto();
  app.innerHTML=bar('EXPORTAR POR DÍA','Texto para WhatsApp',true)+'<main><div class="card"><label class="l">FECHA DEL REPORTE (toque para cambiarla)</label><div class="fecha"><input type="date" id="df" value="'+f0+'" min="'+INICIO+'" max="'+maxFecha()+'" onchange="pvDia()" onclick="try{this.showPicker()}catch(e){}"><button class="hoy" onclick="$(\'#df\').value=fechaDefecto();pvDia()">Hoy</button></div>'+
  '<label class="l">VISTA PREVIA</label><div class="pre" id="dtx"></div><div class="btns" style="margin-top:12px"><button class="btn wa full" onclick="enviarWA()">🟢 Enviar por WhatsApp</button><button class="btn sec" onclick="compartirTxt()">Compartir…</button><button class="btn sec" onclick="copiarTxt()">Copiar</button></div>'+
  '<div class="prev" style="text-align:left">Al tocar “Enviar por WhatsApp” se abre WhatsApp para que elija el contacto. Si no hay señal, WhatsApp lo enviará cuando vuelva la conexión.</div></div></main>';pvDia();}
function pvDia(){const f=$('#df').value;$('#dtx').textContent=f?textoDia(f).txt:'Seleccione una fecha.';}
function enviarWA(){const f=$('#df').value;if(!f)return;const t=textoDia(f).txt;location.href='whatsapp://send?text='+encodeURIComponent(t);
  setTimeout(()=>{if(document.visibilityState==='visible')compartirTxt();},1500);}
function compartirTxt(){const t=textoDia($('#df').value).txt;if(navigator.share)navigator.share({text:t}).catch(()=>{});else copiarTxt();}
function copiarTxt(){const t=textoDia($('#df').value).txt;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Texto copiado. Péguelo en WhatsApp.'),()=>{aviso('No se pudo copiar automáticamente.');});}

const xesc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function col(n){let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
// estilos: 0 normal,1 encabezado,2 num,3 texto borde,4 título,5 porcentaje,6 num negrita,7 texto negrita fondo,8 fecha texto centrado
function hojaXml(sh){let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  var _fx=sh.frzX||0,_fy=sh.frz||0,_pane=_fx?('<pane xSplit="'+_fx+'" ySplit="'+_fy+'" topLeftCell="'+col(_fx)+(_fy+1)+'" activePane="bottomRight" state="frozen"/>'):('<pane ySplit="'+_fy+'" topLeftCell="A'+(_fy+1)+'" activePane="bottomLeft" state="frozen"/>');x+='<sheetViews><sheetView workbookViewId="0">'+_pane+'</sheetView></sheetViews>';
  x+='<cols>'+sh.w.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols><sheetData>';
  sh.rows.forEach((r,ri)=>{x+='<row r="'+(ri+1)+'">';r.forEach((c,ci)=>{if(c==null)return;let v=c,s=0;if(typeof c==='object'){v=c.v;s=c.s||0;}const ref=col(ci)+(ri+1);
      if(typeof v==='number'&&isFinite(v))x+='<c r="'+ref+'" s="'+s+'"><v>'+v+'</v></c>';else x+='<c r="'+ref+'" s="'+s+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>';});x+='</row>';});
  x+='</sheetData>'+(sh.merge?'<mergeCells count="'+sh.merge.length+'">'+sh.merge.map(m=>'<mergeCell ref="'+m+'"/>').join('')+'</mergeCells>':'')+'<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape"/></worksheet>';return x;}
async function libroXlsx(hojas){const z=new JSZip();

  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file('xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+hojas.map((h,i)=>'<sheet name="'+xesc(h.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>');

function hojaObra(o){const M=!!PRES;const H=['ITEM','PARTIDA','UND','METRADO EXPEDIENTE','METRADO REGISTRADO','SALDO METRADO','% AVANCE'].concat(M?['P.U. (S/)','PRESUPUESTO (S/)','AVANCE (S/)','SALDO (S/)']:[]);const nc=H.length,LC=col(nc-1);
  const rows=[[{v:'AVANCE DE OBRA – '+o.n+(TIT2?' – '+TIT2:''),s:4}],[DB[o.k].n],['Fecha de corte: '+fF(hoy())+(M?' · Presupuesto: '+PRES.nombre+' ('+fF(PRES.fecha)+')':'')],[],H.map(h=>({v:h,s:1}))];let tp=0,ta=0,sp=0,n=0;
  const vac=()=>Array.from({length:nc-2},()=>({v:'',s:7}));
  DB[o.k].caps.forEach(c=>{rows.push([{v:c.c,s:7},{v:c.t,s:7},...vac()]);
    c.p.forEach(p=>{const e=estP(p),f=Math.min(1,e.ac/p.mc);sp+=f;n++;const r=[{v:p.i,s:8},{v:p.d,s:3},{v:p.u,s:8},{v:p.m,s:2},{v:e.ac/100,s:2},{v:e.sal/100,s:2},{v:e.ac/p.mc,s:5}];
      if(M){const av=Math.round(p.s*f*100)/100;tp+=p.s;ta+=av;r.push({v:p.pu,s:2},{v:p.s,s:2},{v:av,s:2},{v:Math.round((p.s-av)*100)/100,s:2});}rows.push(r);});});
  const t=[{v:'',s:7},{v:'TOTAL '+o.n+(M?'':' (avance promedio por metrados)'),s:7},{v:'',s:7},{v:'',s:7},{v:'',s:7},{v:'',s:7},{v:M?(tp?ta/tp:0):(n?sp/n:0),s:5}];
  if(M)t.push({v:'',s:7},{v:Math.round(tp*100)/100,s:6},{v:Math.round(ta*100)/100,s:6},{v:Math.round((tp-ta)*100)/100,s:6});rows.push(t);
  return{name:o.n,frz:5,w:[9,60,6,12,12,12,10,11,14,13,13].slice(0,nc),rows,merge:['A1:'+LC+'1','A2:'+LC+'2']};}
function hojaDetalle(){const M=!!PRES;const rows=[[{v:'DETALLE DIARIO DE METRADOS REGISTRADOS',s:4}],['Fecha de corte: '+fF(hoy())],[],['FECHA','OBRA','ITEM','PARTIDA','UND','METRADO'].concat(M?['AVANCE (S/)']:[],['OBSERVACIÓN']).map(h=>({v:h,s:1}))];
  [...S.regs].sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:a.o<b.o?-1:a.o>b.o?1:a.i<b.i?-1:a.i>b.i?1:a.t-b.t).forEach(r=>{const p=P[r.o+'|'+r.i];
    const row=[{v:fF(r.f),s:8},{v:(OBRAS.find(o=>o.k===r.o)||{n:r.o}).n,s:8},{v:r.i,s:8},{v:p.d,s:3},{v:p.u,s:8},{v:r.qc/100,s:2}];if(M)row.push({v:Math.round(p.s*r.qc/p.mc*100)/100,s:2});row.push({v:r.obs||'',s:3});rows.push(row);});

function leerJson(file){return new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>{try{ok(JSON.parse(rd.result));}catch(e){no(new Error('El archivo no es válido.'));}};rd.onerror=()=>no(new Error('No se pudo leer el archivo.'));rd.readAsText(file);});}
function conflictos(x,regs){const ix={};x.obras.forEach(o=>o.caps.forEach(c=>c.p.forEach(q=>{ix[o.k+'|'+q.i]=Math.round(q.m*100);})));const falt=new Set(),exc=new Set(),ac={};
  regs.forEach(r=>{const k=r.o+'|'+r.i;if(!(k in ix))falt.add(r.o+' '+r.i);else ac[k]=(ac[k]||0)+r.qc;});Object.keys(ac).forEach(k=>{if(ac[k]>ix[k])exc.add(k.replace('|',' '));});return{falt:[...falt],exc:[...exc]};}

function pinData(){try{const x=JSON.parse(localStorage.getItem(KPIN));return x&&x.h?x:null;}catch(e){return null;}}
async function hashPin(pin,salt){const t=salt+'|'+pin;try{if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}let h=5381;for(const ch of t)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'd'+h;}
function pedirPin(o,cb){const d=document.createElement('div');d.className='lock';let v='',busy=false;
  d.innerHTML='<div class="lk-ic">🔒</div><div class="lk-t">'+o.t+'</div><div class="lk-s">'+(o.s||'')+'</div><div class="dots">'+'<i></i>'.repeat(4)+'</div><div class="lk-m"></div><div class="kp">'+['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?'<button data-k="'+k+'">'+k+'</button>':'<span></span>').join('')+'</div>'+(o.olvido?'<button class="lk-l" data-k="olv">¿Olvidó su PIN?</button>':'')+(o.cancel?'<button class="lk-l" data-k="can">Cancelar</button>':'');
  document.body.appendChild(d);const dots=d.querySelectorAll('.dots i'),m=d.querySelector('.lk-m'),pinta=()=>dots.forEach((x,i)=>x.classList.toggle('on',i<v.length));
  const ui={err(t){m.textContent=t;const g=d.querySelector('.dots');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');vibrar();},reset(){v='';pinta();},sub(t){d.querySelector('.lk-s').textContent=t;m.textContent='';},close(){d.remove();}};
  d.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b||busy)return;const k=b.dataset.k;
    if(k==='can'){d.remove();return;}if(k==='olv'){o.olvido(ui);return;}if(k==='⌫'){v=v.slice(0,-1);pinta();return;}if(v.length>=4)return;v+=k;pinta();
    if(v.length===4){busy=true;const p=v;setTimeout(async()=>{let r=false;try{r=await cb(p,ui);}catch(e){}busy=false;if(r)d.remove();},150);}});return ui;}

function bloquear(){const pd=pinData();if(!pd||bloqueado)return false;bloqueado=true;document.querySelectorAll('.modal-bg').forEach(x=>x.remove());app.innerHTML='';let fallos=0,espera=0;

    const malas=[...document.querySelectorAll('.almf')].filter(r=>r.querySelector('.am').value.trim()&&![...r.querySelectorAll('.aq')].some(i=>parseFloat(String(i.value).replace(',','.'))>0));

  else{if(!a.txt)return er('Escriba el texto del asiento.');
    if(/____|__:__/.test(a.txt)&&!window._okBlancos){window._okBlancos=true;e.innerHTML='<div class="err-msg" style="background:#fff4e5;color:#7a4a00">⚠ El texto tiene espacios por completar ( ____ ). Complételos, o toque GUARDAR otra vez para guardarlo así.</div>';return;}}

  if(!guardar()){S.cuad=JSON.parse(bk);return;}
  toast('✔ Asiento N° '+pad(a.n)+' guardado'+(ant&&ant.f>a.f?' (ojo: fecha anterior al N° '+pad(ant.n)+')':''));ir('#/cuad',true);}

function valObra(k,corte){const mes=corte.slice(0,7),first=mes+'-01';let T={presup:0,antV:0,actV:0,acuV:0,salV:0};

  const acuM=antM+actM,salM=p.m-acuM;
  // valorizado atado al parcial del presupuesto (no a metrado×PU): al 100% cuadra exacto y el saldo cierra en 0
  const acuV=presup*Math.min(1,p.m?acuM/p.m:0),antV=presup*Math.min(1,p.m?antM/p.m:0);

function colNum(L){let n=0;for(let i=0;i<L.length;i++)n=n*26+(L.charCodeAt(i)-64);return n-1;}
function deEnt(s){return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d)).replace(/&amp;/g,'&');}
async function leerXlsx(file){const z=await JSZip.loadAsync(file);let ss=[];
 const sf=z.file('xl/sharedStrings.xml');if(sf){const t=await sf.async('string');ss=[...t.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>deEnt([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join('')));}
 const names=Object.keys(z.files).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort();if(!names.length)return [];
 const xml=await z.file(names[0]).async('string');const rows=[];
 [...xml.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)].forEach(rm=>{const cells=[];
  [...rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)].forEach(cm=>{const at=cm[1]||'';const rr=(at.match(/r="([A-Z]+)\d+"/)||[])[1];if(!rr)return;const ci=colNum(rr);const t=(at.match(/t="([^"]+)"/)||[])[1];const body=cm[2]||'';let v='';
    const vm=body.match(/<v>([\s\S]*?)<\/v>/);const ism=body.match(/<is>([\s\S]*?)<\/is>/);
    if(t==='s'&&vm)v=ss[+vm[1]]||'';else if(ism)v=deEnt([...ism[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(''));else if(vm)v=vm[1];
    cells[ci]=v;});
  rows.push(cells);});
 return rows;}

const insByNom=n=>CI().find(x=>x.ins.toLowerCase()===String(n).trim().toLowerCase());

function ingCod(cod,obra){return AL().mov.filter(m=>m.tipo==='ING'&&m.cod===cod&&(!obra||m.obra===obra)).reduce((s,m)=>s+m.cant,0);}
function salCod(cod,obra){return AL().mov.filter(m=>m.tipo==='SAL'&&m.cod===cod&&(!obra||m.obra===obra)).reduce((s,m)=>s+m.cant,0);}
const saldoCod=(cod,obra)=>ingCod(cod,obra)-salCod(cod,obra);

async function importArchivo(file){if(!file)return;try{
 if(/\.json$/i.test(file.name)){const d=JSON.parse(await file.text());
   if(d&&d.app==='avobra-insumos'&&Array.isArray(d.insumos))return confirmarCatalogo(d.insumos);
   if(d&&(d.app==='avobra'||d.regs))return restaurarObj(d);
   return aviso('El archivo JSON no es un catálogo de insumos ni un respaldo válido.');}
 const rows=await leerXlsx(file);if(!rows.length)return aviso('No se pudo leer el Excel.');
 // detectar fila de encabezado
 let hi=-1,H=[];for(let i=0;i<Math.min(rows.length,14);i++){const r=(rows[i]||[]).map(x=>String(x||'').toUpperCase());
   const iM=r.findIndex(c=>/MATERIAL/.test(c)),iO=r.findIndex(c=>/OBRA/.test(c)),iC=r.findIndex(c=>/CANTIDAD/.test(c));
   if(iM>=0&&iO>=0&&iC>=0&&iM!==iO){hi=i;H=r;break;}
   const iCod=r.findIndex(c=>/C[OÓ]DIGO/.test(c)),iIns=r.findIndex(c=>/INSUMO|DESCRIP/.test(c)),iU=r.findIndex(c=>/UNIDAD/.test(c));
   if(iCod>=0&&iIns>=0&&iU>=0&&iCod!==iIns){hi=i;H=r;break;}}
 if(hi<0)return aviso('No reconocí el archivo. Use el Catálogo de insumos o la Plantilla de ingresos.');
 const idx=re=>H.findIndex(c=>re.test(c));
 if(H.some(c=>/MATERIAL/.test(c))&&H.some(c=>/OBRA/.test(c))){
   const cF=idx(/FECHA/),cM=idx(/MATERIAL/),cU=idx(/UNIDAD/),cP=idx(/PROVEED/),cG=idx(/GU[IÍ]A|COMPROB/),cC=idx(/CANTIDAD/),cO=idx(/OBRA/);
   const ing=[];for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];const mat=String(r[cM]||'').trim();const cant=parseFloat(String(r[cC]||'').replace(',','.'));const obra=String(r[cO]||'').trim().toUpperCase().slice(0,2);
     if(!mat||!(cant>0))continue;const ix=insByNom(mat);ing.push({f:fechaISO(r[cF]),ins:mat,cod:ix?ix.cod:'',u:ix?ix.u:String(r[cU]||'').trim(),prov:String(r[cP]||'').trim(),guia:String(r[cG]||'').trim(),cant:Math.round(cant*1000)/1000,obra:(obra==='AZ'||obra==='UM')?obra:'AZ',ok:!!ix});}
   if(!ing.length)return aviso('La plantilla no tiene filas de ingresos válidas.');
   return confirmarIngresos(ing);}
 else{const cC=idx(/C[OÓ]DIGO/),cI=idx(/INSUMO|DESCRIP/),cU=idx(/UNIDAD/),cA=idx(/AZ[AÁ]NGARO/),cM=idx(/UMACHIRI/),cT=idx(/TOTAL/),cP=idx(/UNIT/);
   const cat=[];for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];const cod=String(r[cC]||'').trim();const ins=String(r[cI]||'').trim();if(!cod||!ins)continue;
     const az=parseFloat(r[cA])||0,um=parseFloat(r[cM])||0;cat.push({cod,ins,u:String(r[cU]||'').trim(),az,um,tot:parseFloat(r[cT])||az+um,pu:parseFloat(r[cP])||0,req:''});}
   if(!cat.length)return aviso('El catálogo no tiene insumos.');
   return confirmarCatalogo(cat);}
 }catch(e){aviso('Error al importar: '+e.message);}}
function fechaISO(v){if(!v)return hoy();v=String(v).trim();let m=v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);if(/^\d{4}-\d\d-\d\d/.test(v))return v.slice(0,10);const n=parseFloat(v);if(n>30000&&n<60000){const d=new Date(Date.UTC(1899,11,30)+n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}return hoy();}

function ASIS(){if(!S.asis)S.asis={};return S.asis;}
const asisDe=f=>ASIS()[f]||[];
function lunesDe(f){const d=new Date(f+'T12:00:00');const g=d.getDay();d.setDate(d.getDate()+(g===0?-6:1-g));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function semanaDias(f){const L=lunesDe(f),a=[];for(let k=0;k<7;k++)a.push(fechaMas(L,k));return a;}
function semNum(f){return Math.floor(diffD(lunesDe(INICIO),lunesDe(f))/7)+1;}
function obrerosVig(f){return CA().filter(a=>a.rol==='OBRERO'&&a.nom&&desdeEf(a)<=f&&(!a.hasta||a.hasta>=f));}
function diasTrab(ag,dias){return dias.filter(f=>asisDe(f).includes(ag.id)).length;}
const genN=g=>g==='F'?'Fem.':'Masc.';

 app.innerHTML=bar('ASISTENCIA DEL DÍA',diaSem(f)+' '+fF(f),true)+'<main>'+

function hojaF16(corte){const dias=semanaDias(corte),ob=obrerosVig(dias[6]).filter(a=>diasTrab(a,dias)>0),J=CFG().jornal;
 const rows=[[{v:'FORMATO N° 16: HOJA DE JORNALES',s:4}],[{v:'Convenio N°: '+CFG().conv+'   Expediente N°: '+CFG().exp,s:0}],

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('avobra_fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function fotoPut(id,data){try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(data,id);t.oncomplete=()=>res(1);t.onerror=()=>rej(t.error);});}catch(e){return 0;}}
async function fotoGet(id){try{const db=await idb();return await new Promise(res=>{const rq=db.transaction('f','readonly').objectStore('f').get(id);rq.onsuccess=()=>res(rq.result||'');rq.onerror=()=>res('');});}catch(e){return '';}}
async function fotoDel(id){try{const db=await idb();await new Promise(res=>{const t=db.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=()=>res();t.onerror=()=>res();});}catch(e){}}
function FOTOS(){if(!S.fotos)S.fotos=[];return S.fotos;}
const fotosDe=asid=>FOTOS().filter(x=>x.asid===asid);
function comprimir(file,max,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const sc=Math.min(1,(max||1280)/Math.max(w,h));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);try{res(cv.toDataURL('image/jpeg',q||0.55));}catch(e){rej(e);}URL.revokeObjectURL(img.src);};img.onerror=()=>rej(new Error('imagen'));img.src=URL.createObjectURL(file);});}
let _fotoCtx=null;
function pedirFoto(tipo,asid,fecha){_fotoCtx={tipo,asid,fecha:fecha||fechaDefecto()};$('#fotoInput').click();}
async function fotoElegida(file){if(!file||!_fotoCtx)return;try{const data=await comprimir(file,1280,0.55);const id=uid();const ok=await fotoPut(id,data);if(!ok)return aviso('No se pudo guardar la foto en el celular.');
 FOTOS().push({id,f:_fotoCtx.fecha,tipo:_fotoCtx.tipo,asid:_fotoCtx.asid||'',cap:'',t:Date.now()});guardar();toast('✔ Foto agregada');render();}catch(e){aviso('No se pudo procesar la imagen.');}}

function diasLaborMes(mes){let g=0;const last=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate();for(let d=1;d<=last;d++){const f=mes+'-'+pad(d);if(f<INICIO||f>FIN)continue;const dw=new Date(f+'T12:00:00').getDay();if(dw===0||dw===6)continue;if((CFG().feriados||[]).includes(f))continue;g++;}return g;}
function diasResMes(mes){const s=new Set();CU().as.forEach(a=>{if(a.autor==='R'&&a.f.slice(0,7)===mes)s.add(a.f);});return s.size;}
function f19Data(corte,G,H,n){const mes=corte.slice(0,7),first=mes+'-01';const A=CFG().gastoRes||0;const ag=agVig('RESIDENTE',corte);const coef=(ag&&ag.coef)?ag.coef:1;
 let actV=0,presup=0,antAcuV=0;OBRAS.forEach(o=>{const T=valObra(o.k,corte).T;actV+=T.actV;presup+=T.presup;antAcuV+=valObra(o.k,fechaMas(first,-1)).T.acuV;});
 const B=presup?actV/presup:0,C=G?H/G:0,D=Math.round(A*B*C*100)/100,E=Math.round(D*n*10/1000*100)/100,F=Math.round((D-E)*100)/100;
 const acumAnt=Math.round(A*coef*(presup?antAcuV/presup:0)*100)/100;
 return {mes,A,coef,G,H,n,C,B,acumAnt,D,E,F};}
function f19HTML(corte,G,H,n){const d=f19Data(corte,G,H,n);const pc=v=>n2(v*100);const fir=(r,lab)=>{const a=agVig(r,corte);return '<div class="c"><div class="ln"></div><b>'+lab+'</b><div>Nombre: '+esc(a?a.nom:'')+'</div><div>DNI: '+(a&&a.dni?a.dni:'')+'</div></div>';};
 return '<style>.f19 td,.f19 th{border:1px solid #000;padding:3px 5px;font-size:8.5pt;text-align:center}.f19{width:100%;border-collapse:collapse}.hd{display:flex;justify-content:space-between;font-size:9pt;margin:6px 0}.gg{font-size:9pt;line-height:1.7}.firs{display:flex;flex-wrap:wrap;gap:18px 40px;margin-top:30px}.firs .c{width:46%;font-size:8.5pt}.firs .ln{border-top:1px solid #000;margin-bottom:3px}</style>'+
  '<h1 style="font-size:12pt">FORMATO N° 19: AUTORIZACIÓN DE GASTOS DEL RESIDENTE</h1>'+
  '<div class="hd"><span>N°: ____</span><span>CONVENIO N°: '+esc(CFG().conv)+'</span><span>EXPEDIENTE N°: '+esc(CFG().exp)+'</span><span>FECHA: '+fF(corte)+'</span></div>'+
  '<p style="font-size:8.5pt">La autorización de gastos para el pago del Residente se realizará una vez al mes, posterior a la conformidad del Supervisor de Proyectos al informe mensual respectivo.</p>'+
  '<div class="gg"><b>COEFICIENTE DE PARTICIPACIÓN:</b> '+n2(d.coef)+' &nbsp;&nbsp;&nbsp; <b>MES:</b> '+esc(MESU(d.mes))+'<br>'+
  '<b>DÍAS POR ASISTIR EN EL MES:</b> '+d.G+' (G) &nbsp;&nbsp;&nbsp; <b>DÍAS DE RETRASO EN LA PRESENTACIÓN DEL INFORME:</b> '+d.n+' (n)<br>'+
  '<b>DÍAS ASISTIDOS (*):</b> '+d.H+' (H) &nbsp;&nbsp;&nbsp; <b>FACTOR DE ASISTENCIA:</b> '+n2(d.C)+'  C = H/G<br><i>(*) Verificados en Cuaderno de Obra</i></div>'+
  '<div style="text-align:center;font-weight:bold;margin:8px 0 2px;font-size:9pt">PAGO QUE SE AUTORIZA</div>'+
  '<table class="f19"><thead><tr><th>CONCEPTOS</th><th>PRESUPUESTO TOTAL (85%)<br>A</th><th>ACUMULADO AUTORIZADO ANTERIOR</th><th>AVANCE DEL MES %<br>B</th><th>FACTOR DE ASISTENCIA<br>C</th><th>MONTO<br>D = A×B×C</th><th>MORA<br>E = D×n×10/1000</th><th>MONTO NETO<br>F = D−E</th></tr></thead>'+
  '<tbody><tr><td>GASTOS DEL RESIDENTE</td><td>'+n2(d.A)+'</td><td>'+n2(d.acumAnt)+'</td><td>'+pc(d.B)+' %</td><td>'+n2(d.C)+'</td><td>'+n2(d.D)+'</td><td>'+n2(d.E)+'</td><td>'+n2(d.F)+'</td></tr></tbody></table>'+
  '<div class="firs">'+fir('ADMIN','ADMINISTRADOR')+fir('TESORERA','TESORERO ORNE')+fir('PRESIDENTE','PRESIDENTE ORNE')+fir('SECRETARIA','SECRETARIO ORNE')+fir('FISCAL','FISCAL ORNE')+fir('SUPERVISOR','V°B° SUPERVISOR DE PROYECTOS')+'</div>'+
  '<p style="font-size:8pt;margin-top:14px">El Tesorero es responsable de presentar los Comprobantes de Pago en un plazo de 5 días hábiles, contados desde la presente autorización.</p>';}
function hojaF19(corte,G,H,n){const d=f19Data(corte,G,H,n);const rows=[
  [{v:'FORMATO N° 19: AUTORIZACIÓN DE GASTOS DEL RESIDENTE',s:4}],
  [{v:'N°: ____    CONVENIO N°: '+CFG().conv+'    EXPEDIENTE N°: '+CFG().exp+'    FECHA: '+fF(corte),s:0}],[],
  [{v:'COEFICIENTE DE PARTICIPACIÓN:',s:0},{v:d.coef,s:0},{v:'MES:',s:0},{v:MESU(d.mes),s:0}],
  [{v:'DÍAS POR ASISTIR (G):',s:0},{v:d.G,s:0},{v:'DÍAS ASISTIDOS (H):',s:0},{v:d.H,s:0},{v:'FACTOR C=H/G:',s:0},{v:d.C,s:0},{v:'DÍAS RETRASO (n):',s:0},{v:d.n,s:0}],[],
  [{v:'CONCEPTOS',s:1},{v:'PRESUP. TOTAL (85%) A',s:1},{v:'ACUM. AUTORIZ. ANTERIOR',s:1},{v:'AVANCE DEL MES % B',s:1},{v:'FACTOR ASIST. C',s:1},{v:'MONTO D=AxBxC',s:1},{v:'MORA E',s:1},{v:'MONTO NETO F=D-E',s:1}],
  [{v:'GASTOS DEL RESIDENTE',s:3},{v:d.A,s:2},{v:d.acumAnt,s:2},{v:d.B,s:5},{v:d.C,s:2},{v:d.D,s:2},{v:d.E,s:2},{v:d.F,s:2}]];
 return{name:'FORMATO 19',frz:0,w:[26,16,16,13,12,15,12,15],rows,merge:['A1:H1','A2:H2']};}
function modalF19(corte){const mes=corte.slice(0,7);return new Promise(res=>{const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML='<div class="modal"><h3>Formato 19 – '+esc(MESU(mes))+'</h3><p style="font-size:13px;color:var(--sub);margin:0 0 6px">Días laborables del mes (sin domingos ni feriados) y días con asiento del Residente. Edítelos si hace falta.</p>'+
   '<label class="l">DÍAS POR ASISTIR (G)</label><input id="f19g" class="sel" inputmode="numeric" value="'+diasLaborMes(mes)+'">'+
   '<label class="l">DÍAS ASISTIDOS (H)</label><input id="f19h" class="sel" inputmode="numeric" value="'+diasResMes(mes)+'">'+
   '<label class="l">DÍAS DE RETRASO DEL INFORME (n)</label><input id="f19n" class="sel" inputmode="numeric" value="0">'+
   '<div class="acc" style="grid-template-columns:1fr 1fr 1fr;margin-top:10px"><button class="btn sec" data-c="x">Cancelar</button><button class="btn" data-c="E">Excel</button><button class="btn ok" data-c="P">PDF</button></div></div>';
  document.body.appendChild(bg);const close=v=>{const G=+bg.querySelector('#f19g').value||0,H=+bg.querySelector('#f19h').value||0,n=+bg.querySelector('#f19n').value||0;bg.remove();res({v,G,H,n});};
  bg.addEventListener('click',e=>{if(e.target===bg)close('x');const b=e.target.closest('[data-c]');if(b)close(b.dataset.c);});});}
async function expF19(){if(!PRES)return aviso('Cargue el presupuesto para el Formato 19.');const corte=repCorte();const r=await modalF19(corte);if(r.v!=='E'&&r.v!=='P')return;
 if(r.v==='P'){imprimir(docHTML('Formato 19','portrait',f19HTML(corte,r.G,r.H,r.n)));return;}
 try{pickGuardar(await libroXlsx([hojaF19(corte,r.G,r.H,r.n)]),'Formato19_Residente_'+corte.slice(0,7)+'.xlsx');}catch(e){aviso(e.message);}}


// ===== v3.6: Almacén trabaja solo con lo ingresado; buscador vertical; agotados en rojo =====
function movsItem(cod,ins,obra){return AL().mov.filter(m=>m.obra===obra&&(cod?m.cod===cod:((m.cod||'')===''&&m.ins===ins)));}
function ingI(cod,ins,obra){return movsItem(cod,ins,obra).filter(m=>m.tipo==='ING').reduce((s,m)=>s+m.cant,0);}
function salI(cod,ins,obra){return movsItem(cod,ins,obra).filter(m=>m.tipo==='SAL').reduce((s,m)=>s+m.cant,0);}
function itemsIngresados(obra){const seen={},out=[];AL().mov.forEach(m=>{if(m.obra!==obra||m.tipo!=='ING')return;const k=(m.cod||('~'+m.ins.toLowerCase()));if(seen[k])return;seen[k]=1;out.push({cod:m.cod||'',ins:m.ins,u:m.u});});return out;}
function vAlmacen(){const obra=almObra;const chip=(k,t)=>'<button class="chip'+(obra===k?' on':'')+'" onclick="almObra=\''+k+'\';vAlmacen()">'+t+'</button>';
 const q=(almQ||'').toLowerCase().trim();
 let list=itemsIngresados(obra).filter(x=>!q||x.ins.toLowerCase().includes(q)||(x.cod||'').toLowerCase().includes(q)).sort((a,b)=>a.ins.localeCompare(b.ins));
 const cards=list.map(x=>{const ing=ingI(x.cod,x.ins,obra),sal=salI(x.cod,x.ins,obra),s=ing-sal,pre=x.cod?presuCod(x.cod,obra):0;const ago=s<=0;
   return '<div class="card'+(ago?' ago':'')+'" style="padding:10px"><div class="est" style="margin:0"><b style="font-size:14px">'+esc(x.ins)+'</b>'+(ago?'<span class="tag" style="background:#f3a59f;color:#7a1511">AGOTADO</span>':'')+'</div><div class="sub">'+(x.cod||'sin código')+' · '+esc(x.u)+(pre?' · presup. '+n3(pre):'')+'</div><div class="kv"><span>Comprado (ingresado)</span><b>'+n3(ing)+'</b></div><div class="kv"><span>Con salida</span><b>'+n3(sal)+'</b></div><div class="kv"><span>Saldo</span><b class="'+(ago?'c-mal':'')+'">'+n3(s)+'</b></div></div>';}).join('');
 app.innerHTML=bar('ALMACÉN',OBRAS.find(o=>o.k===obra).n,true)+'<main>'+
  '<div class="chips">'+OBRAS.map(o=>chip(o.k,o.n)).join('')+'</div>'+
  '<div class="btns"><button class="btn ok" onclick="formMov(\'ING\')">＋ Ingreso</button><button class="btn" onclick="formMov(\'SAL\')">－ Salida</button></div>'+
  '<div class="btns"><button class="btn sec" onclick="ir(\'#/import\')">📥 Importar</button><button class="btn sec" onclick="ir(\'#/almmov\')">📋 Movimientos</button></div>'+
  '<input class="sel" placeholder="🔎 Buscar insumo…" value="'+esc(almQ||'')+'" oninput="almQ=this.value;clearTimeout(window._aq);window._aq=setTimeout(vAlmacen,300)">'+
  (cards||'<div class="vacio">Aún no ingresó ningún material a esta obra. Importe o registre un ingreso.</div>')+
  '<div class="prev" style="text-align:left">El almacén muestra solo lo que ingresó. Los agotados quedan en rojo. El catálogo del expediente se usa solo como referencia.</div></main>';}
// ----- formulario de movimiento con buscador vertical -----
let MV=null;
function formMov(tipo,f0){MV={tipo,obra:almObra,f:(f0&&/^\d{4}-\d\d-\d\d$/.test(f0))?f0:fechaDefecto(),q:'',sel:null,cant:'',prov:'',guia:'',part:''};renderMov();}
function renderMov(){const tipo=MV.tipo;
 app.innerHTML=bar(tipo==='ING'?'REGISTRAR INGRESO':'REGISTRAR SALIDA',OBRAS.find(o=>o.k===MV.obra).n,true)+'<main><div class="card">'+
  '<label class="l">OBRA</label><select class="sel" onchange="MV.obra=this.value;MV.sel=null;renderMov()">'+OBRAS.map(o=>'<option value="'+o.k+'"'+(o.k===MV.obra?' selected':'')+'>'+esc(o.n)+'</option>').join('')+'</select>'+
  '<label class="l">FECHA</label><div class="fecha"><input type="date" id="mvF" value="'+MV.f+'" min="'+INICIO+'" max="'+maxFecha()+'" onchange="MV.f=this.value"></div>'+
  (MV.sel?selBloque():buscador())+'</div></main>';
 if(!MV.sel)setTimeout(()=>{const s=$('#mvQ');if(s){s.value=MV.q;}},20);}
function buscador(){return '<label class="l">INSUMO</label><input id="mvQ" class="sel" placeholder="🔎 Buscar insumo…" value="'+esc(MV.q)+'" oninput="MV.q=this.value;pintarLista()"><div class="prev" style="text-align:left;margin:2px 0">'+(MV.tipo==='SAL'?'Solo aparecen los insumos que ingresaron. Los agotados, en rojo.':'Elija del catálogo o escriba uno nuevo abajo.')+'</div><div id="mvLista" class="lista">'+filasLista()+'</div>'+(MV.tipo==='ING'?'<div class="btns" style="margin-top:6px"><button class="btn sec full" onclick="nuevoInsLibre()">＋ Material que no está en la lista</button></div>':'');}
function filasLista(){const tipo=MV.tipo,obra=MV.obra,q=MV.q.toLowerCase().trim();let arr;
 if(tipo==='SAL')arr=itemsIngresados(obra);else arr=CI().map(x=>({cod:x.cod,ins:x.ins,u:x.u}));
 arr=arr.filter(x=>!q||x.ins.toLowerCase().includes(q)||(x.cod||'').toLowerCase().includes(q)).sort((a,b)=>a.ins.localeCompare(b.ins));
 window._lista=arr;
 if(!arr.length)return '<div class="vacio" style="padding:12px">'+(tipo==='SAL'?'No hay insumos ingresados en esta obra.':'Sin coincidencias en el catálogo.')+'</div>';
 return arr.slice(0,300).map((x,i)=>{const ing=ingI(x.cod,x.ins,obra),sal=salI(x.cod,x.ins,obra),s=ing-sal;const ago=tipo==='SAL'&&s<=0;
   return '<div class="itm'+(ago?' ago':'')+'" onclick="elegirIdx('+i+')"><div class="nm">'+esc(x.ins)+'</div><div class="sd">'+(x.cod||'sin código')+' · '+esc(x.u)+(tipo==='SAL'?' · saldo '+n3(s)+(ago?' · AGOTADO':''):'')+'</div></div>';}).join('');}
function pintarLista(){const el=$('#mvLista');if(el)el.innerHTML=filasLista();}
function elegirIdx(i){MV.sel=window._lista[i];renderMov();}
function nuevoInsLibre(){const nom=(MV.q||'').trim();MV.sel={cod:'',ins:nom||'(escriba el nombre)',u:'und',libre:1};renderMov();}
function selBloque(){const o=MV.obra,x=MV.sel,tipo=MV.tipo;const ing=ingI(x.cod,x.ins,o),sal=salI(x.cod,x.ins,o),s=ing-sal;
 let h='<div class="card2'+(tipo==='SAL'&&s<=0?' ago':'')+'">'+(x.libre?
   '<label class="l">NOMBRE DEL MATERIAL</label><input id="mvNom" class="sel" value="'+esc(x.ins==='(escriba el nombre)'?'':x.ins)+'"><label class="l">UNIDAD</label><input id="mvU" class="sel" value="'+esc(x.u)+'">'
   :'<b>'+esc(x.ins)+'</b><div class="sub">'+(x.cod||'sin código')+' · '+esc(x.u)+'</div>'+
    '<div class="kv"><span>Comprado (ingresado)</span><b>'+n3(ing)+'</b></div><div class="kv"><span>Con salida</span><b>'+n3(sal)+'</b></div><div class="kv"><span>Saldo por dar salida</span><b class="'+(s<=0?'c-mal':'')+'">'+n3(s)+'</b></div>')+
   '<button class="btn sec full" onclick="MV.sel=null;renderMov()">↩ Cambiar insumo</button></div>';
 h+='<label class="l">CANTIDAD</label><input id="mvC" class="sel" inputmode="decimal" value="'+esc(MV.cant)+'" oninput="MV.cant=this.value">';
 if(tipo==='ING')h+='<label class="l">PROVEEDOR</label><input id="mvP" class="sel" value="'+esc(MV.prov)+'" oninput="MV.prov=this.value"><label class="l">GUÍA / COMPROBANTE</label><input id="mvG" class="sel" value="'+esc(MV.guia)+'" oninput="MV.guia=this.value">';
 else h+='<label class="l">PARTIDA DE DESTINO</label><input id="mvPart" class="sel" list="mvPL" value="'+esc(MV.part)+'" oninput="MV.part=this.value" placeholder="Elija la partida"><datalist id="mvPL">'+DB[o].caps.map(c=>c.p.map(pp=>'<option value="'+pp.i+' '+esc(pp.d)+'">').join('')).join('')+'</datalist>';
 h+='<div id="mvErr"></div><div class="acc"><button class="btn sec" onclick="MV.sel=null;renderMov()">CANCELAR</button><button class="btn ok" onclick="guardarMov()">GUARDAR</button></div>';
 return h;}
function guardarMov(){const tipo=MV.tipo,o=MV.obra,f=$('#mvF')?$('#mvF').value:MV.f,e=$('#mvErr');if(e)e.innerHTML='';const er=m=>{if(e)e.innerHTML='<div class="err-msg">⛔ '+m+'</div>';vibrar();};
 const c=parseFloat(String(MV.cant||($('#mvC')?$('#mvC').value:'')).replace(',','.'));
 if(!MV.sel)return er('Elija el insumo.');
 let cod=MV.sel.cod,ins=MV.sel.ins,u=MV.sel.u;
 if(MV.sel.libre){ins=($('#mvNom')?$('#mvNom').value.trim():'');u=($('#mvU')?$('#mvU').value.trim():'und');if(!ins)return er('Escriba el nombre del material.');}
 if(!/^\d{4}-\d\d-\d\d$/.test(f))return er('Elija la fecha.');
 if(!(c>0))return er('Escriba una cantidad válida.');
 const mv={id:uid(),tipo,f,cod,ins,u,prov:'',guia:'',part:'',obra:o,cant:Math.round(c*1000)/1000,t:Date.now()};
 if(tipo==='ING'){mv.prov=($('#mvP')?$('#mvP').value.trim():'');mv.guia=($('#mvG')?$('#mvG').value.trim():'');}
 else{mv.part=($('#mvPart')?$('#mvPart').value.trim():'');const s=ingI(cod,ins,o)-salI(cod,ins,o);if(c>s+1e-9&&!window._okExc){window._okExc=true;return er('La salida ('+n3(c)+') supera el saldo ('+n3(s)+'). Toque GUARDAR otra vez para forzarla.');}}
 window._okExc=false;AL().mov.push(mv);if(!guardar()){AL().mov.pop();return;}toast('✔ '+(tipo==='ING'?'Ingreso':'Salida')+' registrado');ir('#/almacen',true);}

// ---------- inicio ----------
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
aplicarObra(cargarObra());
if(!bloquear())render();
</script>
