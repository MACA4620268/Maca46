<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
:root{--az:#123a63;--az2:#1d5a96;--fondo:#eef2f6;--card:#fff;--txt:#1b2733;--sub:#5b6b7b;--ok:#1e8e3e;--falta:#e8710a;--mal:#c5221f;--borde:#d5dde6;--hb:56px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--txt);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea{font:inherit}
.bar{position:sticky;top:0;z-index:20;height:var(--hb);background:var(--az);color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;box-shadow:0 2px 6px #0003}
.bar h1{font-size:16px;margin:0;flex:1;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font-weight:400;font-size:12px;opacity:.85}
.bar .ib{background:none;border:0;color:#fff;font-size:24px;width:44px;height:44px;border-radius:8px}
.bar .ib:active{background:#fff2}
main{padding:12px 12px 90px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.obra{cursor:pointer;border-left:6px solid var(--az2)}
.obra:active{background:#f6f9fc}
.obra h2{margin:0 0 6px;font-size:20px;color:var(--az)}
.obra .sub{color:var(--sub);font-size:13px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.kv b{font-variant-numeric:tabular-nums}
.barra{height:12px;background:#e3e8ee;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;background:var(--az2)}
.est{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tag{font-weight:700;padding:2px 8px;border-radius:10px;font-size:13px}
.tag.ok{background:#e6f4ea;color:var(--ok)} .tag.mal{background:#fce8e6;color:var(--mal)} .tag.falta{background:#fef0e1;color:var(--falta)} .tag.neu{background:#e8eef4;color:var(--sub)}
.plazo{font-size:14px;color:var(--sub);margin:0 2px 10px}
.total{background:var(--az);color:#fff}
.total .kv{font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.btn{border:0;border-radius:10px;padding:13px 10px;font-weight:700;background:var(--az2);color:#fff;min-height:48px}
.btn:active{filter:brightness(.9)}
.btn.sec{background:#fff;color:var(--az);border:2px solid var(--az2)}
.btn.ok{background:var(--ok)} .btn.mal{background:var(--mal)} .btn.wa{background:#1f9d55}
.btn[disabled]{opacity:.45}
.full{grid-column:1/-1}
.aviso{background:#fff4e5;border:1px solid #f6c26b;color:#7a4a00;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.chips{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:var(--hb);z-index:5;background:var(--fondo);padding:8px 0}
.chip{flex:1;border:2px solid var(--az2);background:#fff;color:var(--az);border-radius:20px;padding:7px 4px;font-weight:700;font-size:14px}
.chip.on{background:var(--az2);color:#fff}
.cap{font-weight:700;color:var(--az);font-size:14px;padding:10px 4px 6px;border-bottom:2px solid var(--az2);margin-top:6px;display:flex;justify-content:space-between}
.cap span{font-weight:400;color:var(--sub)}
.pt{display:flex;align-items:center;gap:10px;background:#fff;padding:11px 10px;border-bottom:1px solid var(--borde);cursor:pointer}
.pt:active{background:#eef4fb}
.pt .it{font-weight:700;font-size:14px;min-width:42px;color:var(--az)}
.pt .ds{flex:1;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pt .ds small{color:var(--sub)}
.pt .pc{font-weight:700;font-size:14px;min-width:58px;text-align:right}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.c-ok{color:var(--ok)} .c-falta{color:var(--falta)} .c-mal{color:var(--mal)}
.bg-ok{background:var(--ok)} .bg-falta{background:var(--falta)}
.nom{font-size:17px;font-weight:700;color:var(--az)}
.nom .it{display:inline-block;background:var(--az);color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:14px}
label.l{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px;font-weight:600}
.fecha{display:flex;gap:8px;align-items:center}
.fecha input{flex:1;min-width:0;width:100%;padding:12px;border:2px solid var(--borde);border-radius:10px;font-size:18px;font-weight:700;color:var(--az);background:#fff;min-height:50px}
.fecha .hoy{border:0;background:#e8eef4;color:var(--az);border-radius:10px;padding:0 14px;font-weight:700;min-height:50px}
.met{display:flex;align-items:center;gap:8px}
.met input{flex:1;min-width:0;width:100%;padding:12px;border:2px solid var(--az2);border-radius:10px;font-size:24px;font-weight:700;text-align:right;min-height:56px}
.met input.err{border-color:var(--mal);background:#fff5f5}
.met .u{font-weight:700;color:var(--sub);min-width:40px}
.obs{width:100%;padding:10px 12px;border:2px solid var(--borde);border-radius:10px;font-size:15px}
.err-msg{background:#fce8e6;color:var(--mal);font-weight:700;border-radius:8px;padding:9px 11px;margin-top:8px;font-size:14px}
.info{border:1px solid var(--borde);border-radius:10px;margin-top:14px;padding:4px 12px;background:#f9fbfd}
.info .kv{border-bottom:1px dashed var(--borde);padding:7px 0}
.info .kv:last-child{border:0}
.prev{font-size:13px;color:var(--sub);margin-top:6px;text-align:right}
.acc{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.hist th{background:#e8eef4;color:var(--az);text-align:right;padding:7px 6px;font-size:12px}
.hist th:first-child,.hist td:first-child,.hist th:last-child,.hist td:last-child{text-align:left}
.hist td{padding:9px 6px;border-bottom:1px solid var(--borde);text-align:right;font-variant-numeric:tabular-nums}
.hist tr.r{cursor:pointer} .hist tr.r:active{background:#eef4fb}
.hist tfoot td{font-weight:700;border-top:2px solid var(--az2)}
.vacio{color:var(--sub);text-align:center;padding:14px;font-size:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.res-wrap{background:#fff;border-radius:10px;box-shadow:0 1px 3px #0002}
table.res{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12px}
@media (max-width:480px){table.res{font-size:11px}table.res td{padding:6px 2px!important}table.res th{padding:7px 1px!important;font-size:10px!important}}
table.res th{position:sticky;top:var(--hb);z-index:4;background:var(--az2);color:#fff;padding:8px 4px;font-size:11px;line-height:1.15;text-align:center;border-right:1px solid #ffffff40}
table.res td{padding:7px 4px;overflow-wrap:anywhere;border-bottom:1px solid var(--borde);vertical-align:top;font-variant-numeric:tabular-nums}
table.res td.n{text-align:right;white-space:nowrap}
table.res td.c{text-align:center}
table.res tr.capr td{background:#e8eef4;font-weight:700;color:var(--az)}
table.res tr.hl td{background:#fff3c4;font-weight:700}
table.res tr.done td.s{color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2733;color:#fff;padding:12px 18px;border-radius:24px;font-weight:600;z-index:60;box-shadow:0 4px 14px #0005;max-width:92vw;text-align:center}
.modal-bg{position:fixed;inset:0;background:#0007;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px 22px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px;color:var(--az)}
.pre{white-space:pre-wrap;background:#f4f7fa;border:1px solid var(--borde);border-radius:10px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;max-height:45vh;overflow:auto}
.lock{position:fixed;inset:0;z-index:100;background:var(--az);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:8px}
.lk-ic{font-size:34px}.lk-t{font-size:20px;font-weight:700}.lk-s{opacity:.85;font-size:15px}
.dots{display:flex;gap:16px;margin:10px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}.dots i.on{background:#fff}
.lk-m{min-height:22px;color:#ffd7d4;font-weight:700;text-align:center}
.kp{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.kp button{height:74px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:28px;font-weight:600}.kp button:active{background:#ffffff55}
.lk-l{background:none;border:0;color:#cfe3ff;text-decoration:underline;margin-top:6px;font-size:15px}
.sec-t{font-weight:700;color:var(--az);font-size:16px;margin:0 0 8px}
.ok-msg{background:#e6f4ea;color:var(--ok);font-weight:700;border-radius:8px;padding:9px 11px;font-size:14px;margin-bottom:8px}
.ds2{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;font-size:14px;color:#33414f;margin-top:6px}
.txa{width:100%;min-height:220px;padding:10px 12px;border:2px solid var(--az2);border-radius:10px;font-size:15px;line-height:1.4;font-family:inherit}
.sel{width:100%;padding:11px;border:2px solid var(--borde);border-radius:10px;font-size:16px;background:#fff;min-height:48px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;align-items:center;font-size:13px}
.grid3 b{text-align:center;color:var(--sub);font-size:12px}
.grid3 input{width:100%;min-width:0;padding:9px 4px;border:2px solid var(--borde);border-radius:8px;font-size:17px;text-align:center}
.sech{margin:18px 0 6px;padding:6px 10px;background:var(--az);color:#fff;border-radius:8px;font-weight:700;font-size:14px}
.subh{font-weight:700;color:var(--az);margin:8px 0 4px;font-size:14px}
.almf{border:1px dashed var(--borde);border-radius:10px;padding:8px;margin:6px 0}
.almf .am{width:100%;padding:10px;border:2px solid var(--borde);border-radius:8px;font-size:16px}
.almf .r2{display:grid;grid-template-columns:1fr 1.2fr 1.2fr 40px;gap:6px;margin-top:6px}
.almf .r2 input{min-width:0;padding:9px 4px;border:2px solid var(--borde);border-radius:8px;font-size:15px;text-align:center}
.xb{border:0;background:#fce8e6;color:#8a1c17;border-radius:8px;font-size:18px}
.btn.mini{min-height:40px;padding:8px;font-size:15px;margin:4px 0}
.avt{width:100%;border-collapse:collapse;font-size:13px}.avt th{background:#e8eef5;color:var(--az);padding:5px;text-align:center}.avt td{border-bottom:1px solid var(--borde);padding:5px}.avt td+td{text-align:right;white-space:nowrap}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<script src="jszip.min.js"></script>
<script>
"use strict";
const KEY='avobra_regs', KOBRA='avobra_obra', KPIN='avobra_pin', VERSION='2.2';
const DIAS=['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
// ---------- datos de la obra (se cargan desde un archivo privado, solo en este celular) ----------
let OB=null,DB={},OBRAS=[],INICIO='',FIN='',PLAZO=0,TIT='',TIT2='',P={},PRES=null;
function obraValida(x){if(!x||x.app!=='avobra-obra'||!Array.isArray(x.obras)||!x.obras.length)throw new Error('El archivo no es un archivo de obra de esta aplicación.');
  if(!/^\d{4}-\d\d-\d\d$/.test(x.inicio||'')||!/^\d{4}-\d\d-\d\d$/.test(x.fin||'')||x.fin<x.inicio)throw new Error('El archivo de obra no tiene fechas de inicio y término válidas.');
  x.obras.forEach(o=>{if(!o.k||!o.n||!Array.isArray(o.caps))throw new Error('Archivo de obra incompleto.');o.caps.forEach(c=>c.p.forEach(q=>{if(!q.i||!q.d||!q.u||!(q.m>0))throw new Error('Partida inválida en '+o.n+': '+(q.i||'?'));}));});return true;}
function cargarObra(){try{const x=JSON.parse(localStorage.getItem(KOBRA));if(x){obraValida(x);return x;}}catch(e){}return null;}
function aplicarObra(x0){OB=x0;DB={};OBRAS=[];P={};PRES=null;if(!x0)return;const x=JSON.parse(JSON.stringify(x0));INICIO=x.inicio;FIN=x.fin;PLAZO=diffD(INICIO,FIN)+1;TIT=x.titulo||'';TIT2=x.subtitulo||'';
  PRES=x.pres?{nombre:x.pres.nombre,fecha:x.pres.fecha,cargado:x.cargado}:null;
  x.obras.forEach(o=>{OBRAS.push({k:o.k,n:o.n});DB[o.k]={n:o.d||'',caps:o.caps};o.caps.forEach(c=>c.p.forEach(q=>{q.o=o.k;q.cap=c;q.mc=Math.round(q.m*100);if(!PRES){q.pu=null;q.s=0;}P[o.k+'|'+q.i]=q;}));});}
let S=cargar();
function cargar(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.regs))return s;}catch(e){}return{regs:[],lastBackup:null};}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(S));return true;}catch(e){aviso('No se pudo guardar en el celular. Revise el espacio de almacenamiento.');return false;}}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
// ---------- utilidades ----------
const pad=n=>String(n).padStart(2,'0');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fF=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
const diaSem=iso=>DIAS[new Date(iso+'T12:00:00').getDay()];
const diffD=(a,b)=>Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);
const n2=(x,d=2)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sol=x=>'S/ '+n2(x);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const und=u=>({M2:'m²',M3:'m³',ML:'ml'}[u]||u.toLowerCase());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function regsDe(o,i){return S.regs.filter(r=>r.o===o&&r.i===i).sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:a.t-b.t);}
function acumC(o,i,excl){let s=0;for(const r of S.regs)if(r.o===o&&r.i===i&&r.id!==excl)s+=r.qc;return s;}
function estP(p){const ac=acumC(p.o,p.i);return{ac,sal:p.mc-ac,pct:p.mc?ac/p.mc*100:0,done:ac>=p.mc};}
function resObra(k){let pres=0,av=0,sp=0,n=0;DB[k].caps.forEach(c=>c.p.forEach(p=>{const f=Math.min(1,acumC(k,p.i)/p.mc);sp+=f;n++;if(PRES){pres+=p.s;av+=p.s*f;}}));return PRES?{pres,av,sal:pres-av,pct:pres?av/pres*100:0}:{pct:n?sp/n*100:0};}
function plazo(){const h=hoy();let dia=diffD(INICIO,h)+1;if(dia<0)dia=0;if(dia>PLAZO)dia=PLAZO;return{dia,pct:dia/PLAZO*100,faltan:PLAZO-dia};}
function parseNum(s){s=String(s).trim().replace(',','.');if(!/^\d+(\.\d+)?$/.test(s))return{err:'Ingrese un número válido.'};const d=(s.split('.')[1]||'').length;if(d>2)return{err:'Use como máximo 2 decimales.'};const c=Math.round(parseFloat(s)*100);if(c<=0)return{err:'El metrado debe ser mayor que cero.'};return{c};}
function validarFecha(f){if(!f)return'Seleccione una fecha.';if(f<INICIO||f>FIN)return'La fecha debe estar entre '+fF(INICIO)+' y '+fF(FIN)+'.';if(f>hoy())return'No se puede registrar una fecha futura.';return'';}
function maxFecha(){const h=hoy();return h<FIN?h:FIN;}
function fechaDefecto(){const h=hoy();return h<INICIO?INICIO:h>FIN?FIN:h;}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function vibrar(){try{navigator.vibrate&&navigator.vibrate([90,60,90]);}catch(e){}}
function modal(html){return new Promise(res=>{const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML='<div class="modal">'+html+'</div>';document.body.appendChild(bg);
  const close=v=>{bg.remove();res(v);};bg.addEventListener('click',e=>{if(e.target===bg)close(null);const b=e.target.closest('[data-v]');if(b)close(b.dataset.v);});bg._close=close;});}
function aviso(m){return modal('<h3>Aviso</h3><p>'+esc(m)+'</p><button class="btn full" style="width:100%" data-v="ok">Entendido</button>');}
const $=s=>document.querySelector(s);
// ---------- navegación ----------
const app=$('#app');
window.addEventListener('hashchange',render);
function ir(h,reemplazar){if(reemplazar)location.replace(h);else location.hash=h;}
function bar(t,sub,back){return '<div class="bar">'+(back?'<button class="ib" onclick="history.length>1?history.back():ir(\'#/\')" aria-label="Volver">←</button>':'')+'<h1>'+t+(sub?'<small>'+sub+'</small>':'')+'</h1>'+(back?'<button class="ib" onclick="ir(\'#/\')" aria-label="Inicio">⌂</button>':'')+'</div>';}
function render(){if(bloqueado)return;document.querySelectorAll('.modal-bg').forEach(m=>m._close?m._close(null):m.remove());const h=location.hash.replace(/^#\/?/,'').split('/');window.scrollTo(0,0);
  if(!OB)return vBienvenida();
  if(h[0]==='obra'&&DB[h[1]])return vObra(h[1]);
  if(h[0]==='reg'&&P[h[1]+'|'+h[2]])return vReg(P[h[1]+'|'+h[2]]);
  if(h[0]==='res'&&DB[h[1]])return vRes(h[1],h[2]);
  if(h[0]==='dia')return vDia();
  if(h[0]==='respaldo')return vResp();
  if(h[0]==='cuad')return vCuad();
  if(h[0]==='as')return vAsiento(h[1],h[2],h[3]);
  vInicio();}
// ---------- Pantalla 1: inicio ----------
let instalarEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalarEvt=e;if(!location.hash||location.hash==='#/')render();});
function vInicio(){const pl=plazo();let tp=0,ta=0,spct=0;
  const cards=OBRAS.map(o=>{const r=resObra(o.k);if(PRES){tp+=r.pres;ta+=r.av;}spct+=r.pct;const atr=pl.dia>0&&r.pct+1e-9<pl.pct;
    const tag=pl.dia===0?'<span class="tag neu">Por iniciar</span>':atr?'<span class="tag mal">⚠ Atraso</span>':'<span class="tag ok">✔ Al día</span>';
    const np=DB[o.k].caps.reduce((s,c)=>s+c.p.length,0);
    return '<div class="card obra" onclick="ir(\'#/obra/'+o.k+'\')"><h2>'+o.n+'</h2><div class="sub">'+esc(DB[o.k].n)+' · '+np+' partidas</div>'+
      (PRES?'<div class="kv"><span>Presupuesto</span><b>'+sol(r.pres)+'</b></div><div class="kv"><span>Avance a la fecha</span><b>'+sol(r.av)+'</b></div><div class="kv"><span>Saldo</span><b>'+sol(r.sal)+'</b></div>':'')+
      '<div class="barra"><i style="width:'+Math.min(100,r.pct).toFixed(1)+'%;'+(atr?'background:var(--mal)':'')+'"></i></div><div class="est"><b class="'+(atr?'c-mal':'')+'">'+n2(r.pct,1)+' % de avance'+(PRES?'':' (metrados)')+'</b>'+tag+'</div></div>';}).join('');
  const tpct=PRES?(tp?ta/tp*100:0):spct/OBRAS.length;
  let rec='';const dd=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
  if(S.regs.length&&(dd===null||dd>=7))rec='<div class="aviso">💾 '+(dd===null?'Aún no ha hecho ninguna copia de respaldo.':'Último respaldo: hace '+dd+' días.')+' <b>Haga un respaldo hoy</b> desde Ajustes y respaldo.</div>';
  const nopres=PRES?'':'<div class="aviso" style="background:#eef4fb;border-color:#9cc0e6;color:#123a63">🔒 Montos en soles ocultos. Para verlos, cargue el archivo de presupuesto en <b>Ajustes y respaldo</b>.</div>';

function chk(){const p=window._p,q=$('#q');if(!q)return null;const e=$('#err'),pv=$('#prev');e.innerHTML='';q.classList.remove('err');pv.textContent='';
  if(!q.value.trim())return null;const r=parseNum(q.value);
  if(r.err){q.classList.add('err');e.innerHTML='<div class="err-msg">'+r.err+'</div>';return null;}
  const sal=p.mc-acumC(p.o,p.i);
  if(r.c>sal){q.classList.add('err');e.innerHTML='<div class="err-msg">⛔ Excede el metrado. Saldo disponible: '+n2(sal/100)+' '+und(p.u)+'</div>';return null;}
  const nac=acumC(p.o,p.i)+r.c;pv.textContent='Quedará: acumulado '+n2(nac/100)+' · saldo '+n2((p.mc-nac)/100)+' · '+n2(nac/p.mc*100,1)+' %';return r.c;}
function rebote(msg){const e=$('#err');e.innerHTML='<div class="err-msg">'+msg+'</div>';const c=$('.card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');vibrar();}
function aceptar(o,i){const p=P[o+'|'+i],q=$('#q'),f=$('#f').value;
  const ef=validarFecha(f);if(ef)return rebote('⛔ '+ef);
  if(!q.value.trim())return rebote('⛔ Ingrese el metrado avanzado.');
  const r=parseNum(q.value);if(r.err)return rebote('⛔ '+r.err);
  const sal=p.mc-acumC(o,i);if(r.c>sal){q.classList.add('err');return rebote('⛔ Excede el metrado. Saldo disponible: '+n2(sal/100)+' '+und(p.u)+'. No se registró.');}
  const reg={id:uid(),o,i,f,qc:r.c,obs:$('#obs').value.trim(),t:Date.now()};S.regs.push(reg);
  if(!guardar()){S.regs.pop();return;}
  $('#ok').disabled=true;toast('✔ Registrado '+n2(r.c/100)+' '+und(p.u)+' en '+i+' ('+fF(f)+')');ir('#/res/'+o+'/'+i,true);}
async function editarReg(id){const r=S.regs.find(x=>x.id===id);if(!r)return;const p=P[r.o+'|'+r.i];
  const v=await modal('<h3>Registro del '+fF(r.f)+'</h3><p style="margin:0 0 6px">'+p.i+' · '+esc(p.d)+'</p><label class="l">FECHA</label><div class="fecha"><input type="date" id="ef" value="'+r.f+'" min="'+INICIO+'" max="'+maxFecha()+'"></div><label class="l">METRADO</label><div class="met"><input id="eq" inputmode="decimal" value="'+n2(r.qc/100).replace(/,/g,'')+'"><span class="u">'+und(p.u)+'</span></div><label class="l">OBSERVACIÓN</label><input id="eo" class="obs" maxlength="80" value="'+esc(r.obs)+'"><div id="eerr"></div><div class="acc" style="grid-template-columns:1fr 1fr 1fr"><button class="btn mal" data-v="del">Borrar</button><button class="btn sec" data-v="no">Cancelar</button><button class="btn ok" id="eok">Guardar</button></div>'
   .replace('id="eok"','id="eok" onclick="guardarEd(\''+id+'\')"'));
  if(v==='del'){const c=await modal('<h3>¿Borrar este registro?</h3><p>'+fF(r.f)+' · '+n2(r.qc/100)+' '+und(p.u)+'</p><div class="acc" style="grid-template-columns:1fr 1fr"><button class="btn sec" data-v="no">No</button><button class="btn mal" data-v="si">Sí, borrar</button></div>');

function guardarEd(id){const r=S.regs.find(x=>x.id===id),p=P[r.o+'|'+r.i],e=$('#eerr');
  const f=$('#ef').value,ef=validarFecha(f);if(ef){e.innerHTML='<div class="err-msg">⛔ '+ef+'</div>';vibrar();return;}
  const q=parseNum($('#eq').value);if(q.err){e.innerHTML='<div class="err-msg">⛔ '+q.err+'</div>';vibrar();return;}
  const otros=acumC(r.o,r.i,id);if(otros+q.c>p.mc){e.innerHTML='<div class="err-msg">⛔ Excede el metrado. Máximo permitido para este registro: '+n2((p.mc-otros)/100)+' '+und(p.u)+'</div>';vibrar();return;}
  const bk={...r};r.f=f;r.qc=q.c;r.obs=$('#eo').value.trim();if(!guardar()){Object.assign(r,bk);return;}
  document.querySelector('.modal-bg')._close('ok');toast('✔ Registro corregido');render();}

function textoDia(f){const L=['*AVANCE DIARIO – '+diaSem(f)+' '+fF(f)+'*',TIT2,''];let hay=false;
  OBRAS.forEach(o=>{L.push('*'+o.n+'*');const rs=S.regs.filter(r=>r.o===o.k&&r.f===f);
    if(!rs.length){L.push('(sin avance registrado)');L.push('');return;}hay=true;
    const items=[...new Set(rs.map(r=>r.i))].sort();let sd=0;
    items.forEach(i=>{const p=P[o.k+'|'+i];const qd=rs.filter(r=>r.i===i).reduce((s,r)=>s+r.qc,0);
      const ac=S.regs.filter(r=>r.o===o.k&&r.i===i&&r.f<=f).reduce((s,r)=>s+r.qc,0);const u=und(p.u);
      L.push(i+' '+p.d);L.push('  Hoy: '+n2(qd/100)+' '+u+' | Acum: '+n2(ac/100)+' | Saldo: '+n2((p.mc-ac)/100)+' ('+n2(ac/p.mc*100,1)+'%)');
      const obs=rs.filter(r=>r.i===i&&r.obs).map(r=>r.obs);if(obs.length)L.push('  Obs: '+obs.join('; '));if(PRES)sd+=p.s*qd/p.mc;});
    if(PRES)L.push('_Avance valorizado del día: '+sol(sd)+'_');L.push('');});
  L.push('Residente de Obra');return{txt:L.join('\n'),hay};}

function col(n){let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}

function hojaXml(sh){let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  x+='<sheetViews><sheetView workbookViewId="0"><pane ySplit="'+sh.frz+'" topLeftCell="A'+(sh.frz+1)+'" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  x+='<cols>'+sh.w.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols><sheetData>';
  sh.rows.forEach((r,ri)=>{x+='<row r="'+(ri+1)+'">';r.forEach((c,ci)=>{if(c==null)return;let v=c,s=0;if(typeof c==='object'){v=c.v;s=c.s||0;}const ref=col(ci)+(ri+1);

function abrev(s,keep){let n=0;let r=String(s||'').trim().replace(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+/g,w=>{n++;const k=sinTilde(w);if(n>1&&STOP.has(k))return '';if(AB[k]!==undefined)return AB[k];if(UPW.has(k))return w.toUpperCase();return keep?w:w.toLowerCase();});
  r=r.replace(/\.\./g,'.').replace(/\s+([,)]|\.(?!\d))/g,'$1').replace(/\(\s+/g,'(').replace(/\s{2,}/g,' ').trim();return r.charAt(0).toUpperCase()+r.slice(1);}
function corto(k){const o=OBRAS.find(x=>x.k===k)||{n:k};const d=((DB[k]||{}).n||'').split(/\s[–-]\s/)[0].replace(/N[°º]\s*/,'').trim();const m=d.match(/^((?:[A-ZÁÉÍÓÚ]\.){2,})\s*(.+)$/);
  if(!m)return{lar:cap1(o.n),col:cap1(o.n)};const pre=m[1],w=m[2].split(/\s+/),last=w[w.length-1],ini=w.slice(0,-1);
  const lar=pre+' '+(ini.length?ini.map(x=>/^\d/.test(x)?x+' ':x.charAt(0).toUpperCase()+'.').join('').trim()+' ':'')+last;
  const num=w.find(x=>/^\d/.test(x));return{lar,col:pre+' '+(num||w.map(x=>x.charAt(0).toUpperCase()+'.').join(''))};}
const ambas=()=>OBRAS.length>1?'ambas II.EE.':corto(OBRAS[0].k).col;
const colsTxt=()=>OBRAS.map(o=>corto(o.k).col).join(' | ');
function CU(){if(!S.cuad)S.cuad={inicio:0,as:[]};if(!S.cuad.mats)S.cuad.mats=[];return S.cuad;}
function asOrden(){return CU().as.slice().sort((a,b)=>a.n-b.n);}
function sigN(){const a=CU().as;return a.length?Math.max(...a.map(x=>x.n))+1:(CU().inicio||1);}
function obraN(k){return k==='AM'?OBRAS.map(o=>cap1(o.n)).join(' y '):cap1((OBRAS.find(o=>o.k===k)||{n:k}).n);}
function horaAhora(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function pendientes(){const r=new Set(CU().as.filter(a=>a.tipo==='respuesta'&&a.ref).map(a=>+a.ref));return asOrden().filter(a=>a.tipo==='consulta'&&!r.has(a.n));}
function diasSinAsiento(){const con=new Set(CU().as.map(a=>a.f));return [...new Set(S.regs.map(r=>r.f))].filter(f=>!con.has(f)).sort();}
// --- avance y actividades automaticos
function filasAvance(f){const m=new Map();OBRAS.forEach(o=>S.regs.filter(r=>r.o===o.k&&r.f===f).forEach(r=>{const p=P[o.k+'|'+r.i];if(!p)return;const key=r.i+'|'+p.d.trim().toUpperCase()+'|'+p.u;let x=m.get(key);
  if(!x){x={i:r.i,d:abrev(p.d),u:und(p.u),q:{}};m.set(key,x);}x.q[o.k]=(x.q[o.k]||0)+r.qc;}));
  return [...m.values()].sort((a,b)=>a.i.localeCompare(b.i,undefined,{numeric:true}));}
function actAuto(f){const per=OBRAS.map(o=>{const is=[...new Set(S.regs.filter(r=>r.o===o.k&&r.f===f).map(r=>r.i))].filter(i=>P[o.k+'|'+i]).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(!is.length)return null;
  const caps=[...new Set(is.map(i=>lf(abrev(P[o.k+'|'+i].cap.t))))];
  const ps=is.map(i=>{const p=P[o.k+'|'+i];const ac=S.regs.filter(r=>r.o===o.k&&r.i===i&&r.f<=f).reduce((s,r)=>s+r.qc,0);return lf(abrev(p.d))+(ac>=p.mc?' (concluida)':'');});return{k:o.k,caps,ps};}).filter(Boolean);
  if(!per.length)return 'Sin avance de partidas registrado en la fecha.';
  const caps=[...new Set(per.flatMap(x=>x.caps))];
  let t='Se continuó con '+caps.join('; ')+(per.length>1?', en ambas II.EE.':', en la '+corto(per[0].k).lar)+'.';
  if(per.length>1)t+=' '+per.map((x,j)=>(j?'en la ':'En la ')+corto(x.k).lar+(j?', con ':' se avanzó con ')+lista(x.ps)).join('; ')+'.';else t+=' Se avanzó con '+lista(per[0].ps)+'.';
  return t.replace(/\.{2,}/g,'.');}
function txtAvance(f,obra){const L=[];OBRAS.forEach(o=>{if(obra&&obra!=='AM'&&obra!==o.k)return;const rs=S.regs.filter(r=>r.o===o.k&&r.f===f);if(!rs.length)return;
  L.push(corto(o.k).lar+': '+[...new Set(rs.map(r=>r.i))].sort().map(i=>{const p=P[o.k+'|'+i];return i+' '+abrev(p.d)+' ('+und(p.u)+'): '+n2(rs.filter(r=>r.i===i).reduce((s,r)=>s+r.qc,0)/100);}).join('; ')+'.');});
  return L.length?L.join('\n'):'Sin avance registrado en la aplicación para el '+fF(f)+'.';}
// --- plantillas de asientos de texto libre
function plantilla(t,f,a){const pl=plazo();const ob=a&&a.obra&&a.obra!=='AM'?corto(a.obra).lar:'____';switch(t){
  case 'avance':return txtAvance(f,a&&a.obra);
  case 'consulta':return 'Consulta: en la '+ob+', al ejecutar la partida ____ se encontró ____. Se consulta si ____.';
  case 'respuesta':return 'Respecto al Asiento N° '+(a&&a.ref?pad(a.ref):'__')+': ____.';
  case 'ocurrencia':return 'Desde las __:__ h se presentó ____ en la '+ob+'; se suspenden los trab. de ____ y el personal pasa a ____. No afecta la ruta crítica.';
  case 'seguridad':return 'Charla de 5 minutos: ____. Personal con EPP completo y SCTR vigente. Sin incidentes.';
  case 'visita':return 'Visita a '+(a&&a.obra!=='AM'?'la '+ob:ambas())+'. Se verifica el avance según cronograma y el uso de EPP. Recomiendo: ____.';
  case 'mes':{const m=MESES[+f.slice(5,7)-1];return 'Cierre de '+m+' '+f.slice(0,4)+'. Avance físico acumulado: '+OBRAS.map(o=>corto(o.k).col+' '+n2(resObra(o.k).pct,1)+' %').join(', ')+'. Plazo transcurrido: '+n2(pl.pct,1)+' % (día '+pl.dia+' de '+PLAZO+'). Se elabora la Valorización de Avance N° __ (Formato N° 18) y el Informe Mensual del Residente N° __ (Formato N° 33).';}
  case 'inicio':return 'Apertura del presente Cuaderno de Obra, legalizado ante ____, de la intervención '+(TIT2||TIT)+', en '+lista(OBRAS.map(o=>corto(o.k).lar))+'. Plazo: '+PLAZO+' días calendario, del '+fF(INICIO)+' al '+fF(FIN)+'. Residente: ____. Supervisor de Proyectos: ____.';
  case 'termino':return 'Terminación de la intervención física el '+fF(f)+'. Se suscribieron el Acta de Terminación de la Intervención Física (Formato N° 39) y el Acta de Compromiso de Operación y Mantenimiento (Formato N° 38). Con este asiento se da por cerrado el presente Cuaderno de Obra, que consta de __ folios.';
  default:return '';}}
// --- texto del asiento
const nq=v=>v?n2(v/100):'–';
const nv=v=>v?String(+(+v).toFixed(2)):'–';
function textoDiario(a,wa){const b=t=>wa?'*'+t+'*':t,c=' ('+colsTxt()+')',L=[],mo=a.mo||{},al=a.alm||{sal:[],ing:[]};
  L.push(b('1. ACTIVIDADES'));L.push(a.act||'–');
  L.push(b('2. AVANCE DEL DÍA')+c);if((a.av||[]).length)a.av.forEach(x=>L.push(x.i+' '+x.d+' ('+x.u+'): '+OBRAS.map(o=>nq(x.q[o.k])).join(' | ')));else L.push('Sin avance de partidas.');
  L.push(b('3. MANO DE OBRA')+c);const ml=[];if(mo.mae)ml.push('Maestro de obra ('+ambas()+'): '+mo.mae);
  [['op','Operarios'],['of','Oficiales'],['pe','Peones']].forEach(([k,n])=>{if(OBRAS.some(o=>(mo[o.k]||{})[k]))ml.push(n+': '+OBRAS.map(o=>nv((mo[o.k]||{})[k])).join(' | '));});
  const tot=OBRAS.map(o=>{const p=mo[o.k]||{};return (p.op||0)+(p.of||0)+(p.pe||0);});if(tot.some(x=>x))ml.push('Total obreros: '+tot.map(nv).join(' | '));L.push(...(ml.length?ml:['Sin personal.']));
  L.push(b('4. MOVIMIENTO DE ALMACÉN')+c);const fa=x=>x.m+(x.u?' ('+x.u+')':'')+': '+OBRAS.map(o=>nv(x.q[o.k])).join(' | ');
  if(!al.sal.length&&!al.ing.length)L.push('Sin movimiento.');else{L.push('a) Salida a obra'+(al.sal.length?'':': sin movimiento.'));al.sal.forEach(x=>L.push(fa(x)));if(al.ing.length){L.push('b) Ingreso');al.ing.forEach(x=>L.push(fa(x)));}}
  L.push(b('5. EQUIPO'));const eq=OBRAS.filter(o=>(a.eq||{})[o.k]).map(o=>corto(o.k).col+': '+a.eq[o.k]);L.push(...(eq.length?eq:['No se utilizó equipo.']));
  L.push(b('6. HERRAMIENTAS'));L.push(a.herr||'–');
  L.push(b('7. OCURRENCIAS'));const oc=a.oc||{};L.push(...(OBRAS.some(o=>oc[o.k])?OBRAS.map(o=>corto(o.k).col+': '+(oc[o.k]||'sin ocurrencias.')):['Sin ocurrencias.']));
  return L.join('\n');}
function textoAsiento(a,wa){const b=wa?'*':'';const L=[b+'ASIENTO N° '+pad(a.n)+' – DEL '+(a.autor==='S'?'SUPERVISOR DE PROYECTOS':'RESIDENTE')+' – '+fF(a.f)+b];
  if(a.tipo==='diario'){L.push(textoDiario(a,wa));return L.join('\n');}
  L.push(a.txt);const per=[];OBRAS.forEach(o=>{const p=a.pers&&a.pers[o.k];if(p&&(p.op||p.of||p.pe))per.push(corto(o.k).col+': '+[p.op?p.op+' operario(s)':'',p.of?p.of+' oficial(es)':'',p.pe?p.pe+' peón(es)':''].filter(Boolean).join(', '));});
  if(per.length)L.push('Personal en obra – '+per.join('; ')+'.');if(a.clima)L.push('Clima: '+a.clima+'.');return L.join('\n');}
function enviarTexto(t){location.href='whatsapp://send?text='+encodeURIComponent(t);setTimeout(()=>{if(document.visibilityState==='visible'&&navigator.share)navigator.share({text:t}).catch(()=>{});},1500);}

   '<div class="btns" style="margin-top:10px"><button class="btn wa" onclick="enviarTexto(textoAsiento(leerAs(),true))">🟢 WhatsApp</button><button class="btn sec" onclick="copiarAs()">Copiar</button>'+
   (nuevo?'':'<button class="btn full" onclick="pasarAs()">✍️ Ya lo pasé al cuaderno físico</button>'+(a.n===Math.max(...CU().as.map(x=>x.n))?'<button class="btn mal full" onclick="borrarAs()">Borrar este asiento</button>':''))+'</div>'+
   '</div><div class="prev" style="text-align:left">La aplicación es un borrador ordenado: el asiento oficial es el que se escribe y firma en el cuaderno físico legalizado.</div></main>';}
function numIn(id){const el=$('#'+id);if(!el)return 0;const v=parseInt((el.value||'').trim(),10);return v>0?v:0;}
function leerAlm(id){return [...document.querySelectorAll('#'+id+' .almf')].map(r=>{const m=abrev(r.querySelector('.am').value,true),u=abrev(r.querySelector('.au').value,true).toLowerCase(),q={};
  r.querySelectorAll('.aq').forEach(i=>{const v=parseFloat(String(i.value).trim().replace(',','.'));if(v>0)q[i.dataset.k]=Math.round(v*100)/100;});return{m,u,q};}).filter(x=>x.m&&Object.keys(x.q).length);}
function leerAs(){const a=Object.assign({},window._as);a.f=$('#aF').value;a.autor=$('#aAut').value;a.tipo=$('#aTipo').value;
  if(a.tipo==='diario'){a.act=$('#aAct').value.trim();a.av=filasAvance(a.f);a.mo={mae:numIn('mae')};OBRAS.forEach(o=>{const p={op:numIn('po_'+o.k),of:numIn('pf_'+o.k),pe:numIn('pp_'+o.k)};if(p.op||p.of||p.pe)a.mo[o.k]=p;});
    a.alm={sal:leerAlm('salBox'),ing:leerAlm('ingBox')};a.eq={};a.oc={};OBRAS.forEach(o=>{const e=$('#eq_'+o.k).value.trim(),c=$('#oc_'+o.k).value.trim();if(e)a.eq[o.k]=e;if(c)a.oc[o.k]=c;});
    a.herr=$('#aHerr').value.trim();a.obra='AM';a.ref='';a.txt=textoDiario(a);a.pers={};a.clima='';}
  else{a.obra=$('#aObra').value;a.ref=a.tipo==='respuesta'?($('#aRef').value||''):'';a.txt=$('#aTxt').value.trim();}
  return a;}
function regenAct(){$('#aAct').value=actAuto($('#aF').value);}
function cambioFecha(){const f=$('#aF').value,prev=window._as;if(!/^\d{4}-\d\d-\d\d$/.test(f))return;
  const act=$('#aAct').value.trim();if(!act||act===actAuto(prev.f).trim())$('#aAct').value=actAuto(f);$('#avBox').innerHTML=avHTML(f);
  const cur=$('#aTxt').value.trim();if(prev.tipo!=='diario'&&(!cur||cur===plantilla(prev.tipo,prev.f,prev).trim())){const a=leerAs();$('#aTxt').value=plantilla(a.tipo,f,a);}
  window._as=Object.assign(window._as,{f});}
function cambioTipo(){const t=$('#aTipo').value,prev=window._as;$('#boxDia').style.display=t==='diario'?'block':'none';$('#boxLib').style.display=t==='diario'?'none':'block';$('#refBox').style.display=t==='respuesta'?'block':'none';
  if(t==='visita'||t==='respuesta')$('#aAut').value='S';
  if(t!=='diario'){const cur=$('#aTxt').value.trim();if(!cur||cur===plantilla(prev.tipo,prev.f,prev).trim()){const a=leerAs();$('#aTxt').value=plantilla(t,a.f,a);}}
  window._as=Object.assign(window._as,{tipo:t});}
function cambioRef(){const a=leerAs();const t=$('#aTxt').value;if(/^Respecto al Asiento N° (\d+|__):/.test(t))$('#aTxt').value=t.replace(/^Respecto al Asiento N° (\d+|__):/,'Respecto al Asiento N° '+(a.ref?pad(a.ref):'__')+':');}
async function usarPlantilla(){const a=leerAs();if(a.txt){const c=await modal('<h3>¿Reemplazar el texto?</h3><p>Se pondrá la plantilla de "'+esc(tipoN(a.tipo))+'" en lugar del texto actual.</p><div class="acc" style="grid-template-columns:1fr 1fr"><button class="btn sec" data-v="no">Cancelar</button><button class="btn" data-v="si">Reemplazar</button></div>');if(c!=='si')return;}$('#aTxt').value=plantilla(a.tipo,a.f,a);}
function guardarAs(){const a=leerAs(),e=$('#err');e.innerHTML='';const er=m=>{e.innerHTML='<div class="err-msg">⛔ '+m+'</div>';vibrar();};
  if(!/^\d{4}-\d\d-\d\d$/.test(a.f))return er('Elija la fecha del asiento.');
  if(a.f>hoy())return er('No se puede registrar un asiento con fecha futura.');
  if(a.tipo==='diario'){if(!a.act)return er('Escriba las actividades del día.');
    const malas=[...document.querySelectorAll('.almf')].filter(r=>r.querySelector('.am').value.trim()&&![...r.querySelectorAll('.aq')].some(i=>parseFloat(String(i.value).replace(',','.'))>0));
    if(malas.length)return er('Hay insumos de almacén sin cantidad. Escriba la cantidad o quite la fila con ✕.');}
  else{if(!a.txt)return er('Escriba el texto del asiento.');
    if(/____|__:__/.test(a.txt)&&!window._okBlancos){window._okBlancos=true;e.innerHTML='<div class="err-msg" style="background:#fff4e5;color:#7a4a00">⚠ El texto tiene espacios por completar ( ____ ). Complételos, o toque GUARDAR otra vez para guardarlo así.</div>';return;}}
  window._okBlancos=false;const c=CU();const bk=JSON.stringify(c);
  if(a.tipo==='diario')[...a.alm.sal,...a.alm.ing].forEach(x=>{const i=c.mats.findIndex(y=>y.m.toLowerCase()===x.m.toLowerCase());if(i>=0)c.mats.splice(i,1);c.mats.unshift({m:x.m,u:x.u});});c.mats=c.mats.slice(0,200);
  if(window._asNuevo){a.id=uid();a.n=sigN();a.t=Date.now();c.as.push(a);}else{const i=c.as.findIndex(x=>x.id===a.id);c.as[i]=a;}
  const ant=c.as.filter(x=>x.n<a.n).sort((x,y)=>y.n-x.n)[0];
  if(!guardar()){S.cuad=JSON.parse(bk);return;}
  toast('✔ Asiento N° '+pad(a.n)+' guardado'+(ant&&ant.f>a.f?' (ojo: fecha anterior al N° '+pad(ant.n)+')':''));ir('#/cuad',true);}
async function pasarAs(){const a=leerAs();const c=await modal('<h3>¿Ya lo escribió en el cuaderno físico?</h3><p>El asiento N° '+pad(a.n)+' quedará <b>bloqueado</b>, igual que en el papel.</p><div class="acc" style="grid-template-columns:1fr 1fr"><button class="btn sec" data-v="no">Todavía no</button><button class="btn ok" data-v="si">Sí, ya lo pasé</button></div>');
  if(c!=='si')return;a.pasado=true;const cu=CU();const i=cu.as.findIndex(x=>x.id===a.id);const bk=cu.as[i];cu.as[i]=a;if(!guardar()){cu.as[i]=bk;return;}toast('✔ Asiento N° '+pad(a.n)+' marcado como pasado');ir('#/cuad',true);}
async function desbloquearAs(){const a=window._as;const c=await modal('<h3>¿Desbloquear el asiento N° '+pad(a.n)+'?</h3><p>Hágalo solo para corregir un error de transcripción. En el cuaderno físico no se borra: se anula con una línea y se escribe "Corrijo: …".</p><div class="acc" style="grid-template-columns:1fr 1fr"><button class="btn sec" data-v="no">Cancelar</button><button class="btn mal" data-v="si">Desbloquear</button></div>');
  if(c!=='si')return;a.pasado=false;guardar();render();}
async function borrarAs(){const a=window._as;const c=await modal('<h3>¿Borrar el asiento N° '+pad(a.n)+'?</h3><p>Solo se puede borrar el último asiento, para no dejar saltos en la numeración.</p><div class="acc" style="grid-template-columns:1fr 1fr"><button class="btn sec" data-v="no">Cancelar</button><button class="btn mal" data-v="si">Borrar</button></div>');
  if(c!=='si')return;const cu=CU();const bk=cu.as.slice();cu.as=cu.as.filter(x=>x.id!==a.id);if(!guardar()){cu.as=bk;return;}toast('Asiento borrado');ir('#/cuad',true);}
function copiarAs(){const a=$('#aF')?leerAs():window._as;const t=textoAsiento(a);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Texto copiado'),()=>aviso('No se pudo copiar automáticamente.'));}
function hojaCuaderno(){const rows=[[{v:'CUADERNO DE OBRA – BORRADOR DE ASIENTOS'+(TIT2?' – '+TIT2:''),s:4}],['Fecha de corte: '+fF(hoy())],[],['N°','FECHA','AUTOR','TIPO','CONTENIDO DEL ASIENTO','EN CUADERNO'].map(h=>({v:h,s:1}))];
  asOrden().forEach(a=>rows.push([{v:a.n,s:8},{v:fF(a.f),s:8},{v:a.autor==='S'?'Supervisor':'Residente',s:8},{v:tipoN(a.tipo),s:3},{v:textoAsiento(a).split('\n').slice(1).join('\n'),s:3},{v:a.pasado?'Sí':'No',s:8}]));
  return{name:'CUADERNO DE OBRA',frz:4,w:[6,11,11,16,110,10],rows};}
// ---------- inicio ----------
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
aplicarObra(cargarObra());
if(!bloquear())render();
</script>
